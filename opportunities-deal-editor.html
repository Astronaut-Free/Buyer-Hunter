<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>黔脉 QianPulse｜第四页手机编辑器</title>
  <style>
    :root{--green:#123b32;--warm:#f7f4ec;--gold:#d5a33f;--ink:#172720;--muted:#718079}*{box-sizing:border-box}html,body{width:100%;min-height:100%;margin:0}body{height:100vh;overflow:hidden;color:var(--ink);background:#e9eee9;font-family:ui-sans-serif,system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}button,input,select{font:inherit}.editor-header{height:64px;display:flex;align-items:center;gap:18px;padding:0 22px;color:#fff;background:var(--green);box-shadow:0 5px 18px rgba(0,25,18,.2)}.editor-brand{flex:1 1 auto;min-width:0}.editor-title{margin:0;font-size:17px;line-height:1.1}.editor-subtitle{margin:5px 0 0;color:rgba(255,255,255,.65);font-size:10px;letter-spacing:.04em}.device-picker{display:flex;align-items:center;gap:9px}.device-picker label{color:rgba(255,255,255,.72);font-size:12px}.device-select{height:38px;padding:0 34px 0 12px;color:var(--green);background:var(--warm);border:0;border-radius:9px;cursor:pointer;font-weight:700}.open-page{min-height:38px;display:inline-flex;align-items:center;padding:0 14px;color:#fff;border:1px solid rgba(255,255,255,.28);border-radius:9px;text-decoration:none;font-size:12px;font-weight:700}.workbench{height:calc(100vh - 64px);display:grid;grid-template-columns:minmax(0,1fr) 410px}.preview-stage{min-width:0;min-height:0;position:relative;display:grid;place-items:center;overflow:auto;padding:28px;background-color:#dfe6e1;background-image:linear-gradient(rgba(18,59,50,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(18,59,50,.06) 1px,transparent 1px);background-size:24px 24px}.phone-mount{position:relative;flex:0 0 auto}.phone-shell{position:absolute;left:0;top:0;padding:10px;background:#13231e;border-radius:28px;box-shadow:0 26px 64px rgba(8,32,25,.3),0 0 0 1px rgba(255,255,255,.1) inset;transform-origin:left top}.phone-shell::before{content:"";position:absolute;z-index:3;left:50%;top:4px;width:76px;height:17px;background:#13231e;border-radius:0 0 12px 12px;transform:translateX(-50%);pointer-events:none}.phone-frame{width:100%;height:100%;display:block;overflow:hidden;background:#0d2d25;border:0;border-radius:19px}.device-badge{position:absolute;left:18px;bottom:14px;padding:7px 10px;color:#dce9e1;background:rgba(18,59,50,.82);border:1px solid rgba(255,255,255,.16);border-radius:8px;font:600 10px/1 ui-monospace,SFMono-Regular,Menlo,monospace;pointer-events:none}.control-panel{min-width:0;overflow:auto;padding:16px;background:rgba(255,255,255,.98);border-left:1px solid rgba(18,59,50,.12);box-shadow:-10px 0 30px rgba(18,59,50,.08)}.panel-head{margin-bottom:12px}.panel-title{margin:0;color:var(--green);font-size:18px}.panel-copy{margin:6px 0 0;color:var(--muted);font-size:11px;line-height:1.55}.control-group{min-width:0;margin:0 0 10px;padding:11px 12px 12px;border:1px solid rgba(18,59,50,.13);border-radius:12px}.control-group legend{max-width:330px;padding:0 7px;overflow:hidden;color:var(--green);font-size:12px;font-weight:800;text-overflow:ellipsis;white-space:nowrap}.layout-group{background:#f7f4ec;border-color:rgba(213,163,63,.42)}.control-row{display:grid;grid-template-columns:72px minmax(0,1fr) 72px;align-items:center;gap:8px;min-height:34px}.control-row+.control-row{margin-top:6px}.control-row label{font-size:11px;font-weight:700}.control-row input[type="range"]{width:100%;accent-color:var(--gold);cursor:pointer}.number-wrap{position:relative}.number-input{width:100%;height:31px;padding:0 24px 0 7px;color:var(--green);background:#fff;border:1px solid rgba(18,59,50,.18);border-radius:7px;font:650 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace}.unit{position:absolute;right:7px;top:50%;color:#839089;font-size:9px;transform:translateY(-50%);pointer-events:none}.reset-button{min-height:33px;width:100%;margin-top:9px;color:var(--green);background:var(--warm);border:1px solid rgba(18,59,50,.13);border-radius:8px;cursor:pointer;font-size:10px;font-weight:750}.parameter-output{margin:5px 0 10px;padding:11px;max-height:220px;overflow:auto;color:#dce9e1;background:var(--green);border-radius:10px;font:9.5px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap}.panel-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding-bottom:12px}.panel-action{min-height:40px;color:var(--green);background:#fff;border:1px solid rgba(18,59,50,.17);border-radius:9px;cursor:pointer;font-size:11px;font-weight:800}.panel-action-primary{color:#fff;background:var(--green)}.copy-status{min-height:18px;margin:0;color:#688078;font-size:10px;text-align:center}@media(max-width:980px){body{height:auto;overflow:auto}.editor-header{height:auto;min-height:64px;flex-wrap:wrap;padding:12px 14px}.editor-brand{flex-basis:100%}.workbench{height:auto;min-height:calc(100vh - 96px);grid-template-columns:1fr}.preview-stage{height:72vh;min-height:580px}.control-panel{border-top:1px solid rgba(18,59,50,.12);border-left:0}}
  </style>
</head>
<body>
  <header class="editor-header"><div class="editor-brand"><h1 class="editor-title">主页面第四页手机编辑器</h1><p class="editor-subtitle">标题文字与 2 × 2 商机推进卡片可视化调节</p></div><div class="device-picker"><label for="deviceSelect">手机尺寸</label><select class="device-select" id="deviceSelect"><option value="360x800">360 × 800</option><option value="390x844" selected>390 × 844</option><option value="393x852">393 × 852</option><option value="430x932">430 × 932</option></select></div><a class="open-page" href="opportunities.html#deal-progression" target="_blank" rel="noopener">打开普通主页面 ↗</a></header>
  <main class="workbench">
    <section class="preview-stage" id="previewStage" aria-label="主页面第四页手机预览"><div class="phone-mount" id="phoneMount"><div class="phone-shell" id="phoneShell"><iframe class="phone-frame" id="phoneFrame" src="opportunities.html?deal-preview=1#deal-progression" title="黔脉主页面第四页手机预览"></iframe></div></div><span class="device-badge" id="deviceBadge">390 × 844</span></section>
    <aside class="control-panel" aria-label="主页面第四页元素编辑器">
      <div class="panel-head"><h2 class="panel-title">第四页布局参数</h2><p class="panel-copy">调整标题大小与位置；四张卡片固定按 A3、A4、A5、A6 两列排列。</p></div>
      <fieldset class="control-group layout-group"><legend>第四页与卡片布局</legend><div class="control-row"><label for="sectionPaddingTop">页面上边距</label><input id="sectionPaddingTop" data-control="sectionPaddingTop" type="range" min="0" max="140" step="1"><span class="number-wrap"><input class="number-input" data-number="sectionPaddingTop" type="number" min="0" max="140" step="1"><span class="unit">px</span></span></div><div class="control-row"><label for="gridMarginTop">卡片上边距</label><input id="gridMarginTop" data-control="gridMarginTop" type="range" min="-40" max="120" step="1"><span class="number-wrap"><input class="number-input" data-number="gridMarginTop" type="number" min="-40" max="120" step="1"><span class="unit">px</span></span></div><div class="control-row"><label for="cardGap">卡片间距</label><input id="cardGap" data-control="cardGap" type="range" min="4" max="28" step="1"><span class="number-wrap"><input class="number-input" data-number="cardGap" type="number" min="4" max="28" step="1"><span class="unit">px</span></span></div><div class="control-row"><label for="cardRatio">卡片宽高比</label><input id="cardRatio" data-control="cardRatio" type="range" min="0.45" max="0.9" step="0.01"><span class="number-wrap"><input class="number-input" data-number="cardRatio" type="number" min="0.45" max="0.9" step="0.01"><span class="unit">比</span></span></div><button class="reset-button" data-reset="layout" type="button">重置卡片布局</button></fieldset>
      <div id="textControlGroups"></div><pre class="parameter-output" id="parameterOutput" aria-live="polite">正在连接手机预览…</pre><div class="panel-actions"><button class="panel-action" id="resetAll" type="button">全部重置</button><button class="panel-action panel-action-primary" id="copyParameters" type="button">复制参数</button></div><p class="copy-status" id="copyStatus"></p>
    </aside>
  </main>
  <script>
  (()=>{
    const definitions=[
      {key:'dealKicker',selector:'.qp-deal-kicker',label:'OPPORTUNITY PROGRESSION'},
      {key:'dealTitle',selector:'.qp-deal-title',label:'从商机发现到成交推进'},
      {key:'dealIntro',selector:'.qp-deal-intro',label:'标题辅助文字'}
    ];
    const frame=document.getElementById('phoneFrame'),stage=document.getElementById('previewStage'),mount=document.getElementById('phoneMount'),shell=document.getElementById('phoneShell'),deviceSelect=document.getElementById('deviceSelect'),deviceBadge=document.getElementById('deviceBadge'),parameterOutput=document.getElementById('parameterOutput'),copyStatus=document.getElementById('copyStatus');
    const groups={layout:['sectionPaddingTop','gridMarginTop','cardGap','cardRatio']};let state=null,initial=null,preview=null;
    const textGroups=document.getElementById('textControlGroups');definitions.forEach((definition,index)=>{const group=document.createElement('fieldset');group.className='control-group';group.innerHTML=`<legend>${index+1}. ${definition.label}</legend><div class="control-row"><label for="${definition.key}X">水平偏移</label><input id="${definition.key}X" data-control="${definition.key}X" type="range" min="-180" max="180" step="1"><span class="number-wrap"><input class="number-input" data-number="${definition.key}X" type="number" min="-180" max="180" step="1"><span class="unit">px</span></span></div><div class="control-row"><label for="${definition.key}Y">垂直偏移</label><input id="${definition.key}Y" data-control="${definition.key}Y" type="range" min="-180" max="180" step="1"><span class="number-wrap"><input class="number-input" data-number="${definition.key}Y" type="number" min="-180" max="180" step="1"><span class="unit">px</span></span></div><div class="control-row"><label for="${definition.key}Size">文字大小</label><input id="${definition.key}Size" data-control="${definition.key}Size" type="range" min="8" max="76" step="0.5"><span class="number-wrap"><input class="number-input" data-number="${definition.key}Size" type="number" min="8" max="76" step="0.5"><span class="unit">px</span></span></div><button class="reset-button" data-reset="${definition.key}" type="button">重置本组</button>`;textGroups.appendChild(group);groups[definition.key]=[`${definition.key}X`,`${definition.key}Y`,`${definition.key}Size`];});
    function getDevice(){const [width,height]=deviceSelect.value.split('x').map(Number);return{width,height}}
    function fitPhone(){const{width,height}=getDevice();shell.style.width=`${width+20}px`;shell.style.height=`${height+20}px`;frame.style.width=`${width}px`;frame.style.height=`${height}px`;const scale=Math.min(1,Math.max(280,stage.clientWidth-64)/(width+20),Math.max(500,stage.clientHeight-64)/(height+20));shell.style.transform=`scale(${scale})`;mount.style.width=`${(width+20)*scale}px`;mount.style.height=`${(height+20)*scale}px`;deviceBadge.textContent=`${width} × ${height} · ${Math.round(scale*100)}% 显示`}
    function getPreview(){const doc=frame.contentDocument;if(!doc)return null;const section=doc.querySelector('.qp-deal-section'),grid=doc.querySelector('.qp-deal-section .qp-bento-grid'),cards=[...doc.querySelectorAll('.qp-deal-section .qp-op-card')],targets=Object.fromEntries(definitions.map(definition=>[definition.key,doc.querySelector(definition.selector)]));return section&&grid&&cards.length===4&&Object.values(targets).every(Boolean)?{doc,section,grid,cards,targets}:null}
    function installPreview(){preview=getPreview();if(!preview)return;let style=preview.doc.getElementById('qpDealEditorStyle');if(!style){style=preview.doc.createElement('style');style.id='qpDealEditorStyle';style.textContent=`.qp-product-gallery,.qp-demand-section,.qp-core-section,.qp-final-cta{display:none!important}.qp-deal-section{min-height:100vh!important}.qp-deal-kicker,.qp-deal-title,.qp-deal-intro{outline:1px dashed rgba(213,163,63,.95);outline-offset:3px}`;preview.doc.head.appendChild(style)}frame.contentWindow.scrollTo(0,Math.max(0,preview.section.offsetTop-60))}
    function numeric(element,property,fallback){const value=Number.parseFloat(frame.contentWindow.getComputedStyle(element).getPropertyValue(property));return Number.isFinite(value)?value:fallback}
    function translation(element){const value=frame.contentWindow.getComputedStyle(element).transform;if(!value||value==='none')return{x:0,y:0};const Matrix=frame.contentWindow.DOMMatrixReadOnly||frame.contentWindow.DOMMatrix;if(!Matrix)return{x:0,y:0};const matrix=new Matrix(value);return{x:Math.round(matrix.m41*10)/10,y:Math.round(matrix.m42*10)/10}}
    function readInitial(){preview=getPreview();if(!preview)return;installPreview();const ratio=Number.parseFloat(frame.contentWindow.getComputedStyle(preview.cards[0]).aspectRatio);initial={sectionPaddingTop:numeric(preview.section,'padding-top',58),gridMarginTop:numeric(preview.grid,'margin-top',36),cardGap:numeric(preview.grid,'column-gap',10),cardRatio:Number.isFinite(ratio)?Math.round(ratio*100)/100:.58};definitions.forEach(definition=>{const target=preview.targets[definition.key],move=translation(target);initial[`${definition.key}X`]=move.x;initial[`${definition.key}Y`]=move.y;initial[`${definition.key}Size`]=Math.round(numeric(target,'font-size',14)*10)/10});state={...initial};syncAll();applyLayout()}
    function applyLayout(){if(!state)return;preview=getPreview();if(!preview)return;installPreview();preview.section.style.setProperty('padding-top',`${state.sectionPaddingTop}px`,'important');preview.grid.style.setProperty('grid-template-columns','repeat(2,minmax(0,1fr))','important');preview.grid.style.setProperty('margin-top',`${state.gridMarginTop}px`,'important');preview.grid.style.setProperty('gap',`${state.cardGap}px`,'important');preview.cards.forEach(card=>card.style.setProperty('aspect-ratio',`${state.cardRatio}`,'important'));definitions.forEach(definition=>{const target=preview.targets[definition.key];target.style.setProperty('font-size',`${state[`${definition.key}Size`]}px`,'important');target.style.setProperty('transform',`translate3d(${state[`${definition.key}X`]}px,${state[`${definition.key}Y`]}px,0)`,'important')});const lines=[`第四页  padding-top:${state.sectionPaddingTop}px; card-margin-top:${state.gridMarginTop}px; card-gap:${state.cardGap}px; card-ratio:${state.cardRatio};`,`卡片布局  2 columns × 2 rows; order:A3,A4,A5,A6;`];definitions.forEach(definition=>lines.push(`${definition.label}  font-size:${state[`${definition.key}Size`]}px; translate(${state[`${definition.key}X`]}px,${state[`${definition.key}Y`]}px);`));parameterOutput.textContent=lines.join('\n')}
    function sync(key,value){if(!state)return;state[key]=Number(value);const range=document.querySelector(`[data-control="${key}"]`),number=document.querySelector(`[data-number="${key}"]`);if(range)range.value=state[key];if(number)number.value=Math.round(state[key]*100)/100;applyLayout()}
    function syncAll(){Object.keys(state).forEach(key=>{const range=document.querySelector(`[data-control="${key}"]`),number=document.querySelector(`[data-number="${key}"]`);if(range)range.value=state[key];if(number)number.value=Math.round(state[key]*100)/100})}
    document.querySelectorAll('[data-control]').forEach(input=>input.addEventListener('input',()=>sync(input.dataset.control,input.value)));document.querySelectorAll('[data-number]').forEach(input=>input.addEventListener('input',()=>{if(input.value===''||!state)return;sync(input.dataset.number,Math.min(Number(input.max),Math.max(Number(input.min),Number(input.value))))}));document.querySelectorAll('[data-reset]').forEach(button=>button.addEventListener('click',()=>groups[button.dataset.reset].forEach(key=>sync(key,initial[key]))));document.getElementById('resetAll').addEventListener('click',()=>{state={...initial};syncAll();applyLayout();copyStatus.textContent='已恢复第四页初始布局'});document.getElementById('copyParameters').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(parameterOutput.textContent);copyStatus.textContent='参数已复制'}catch{copyStatus.textContent='复制失败，请手动选择上方参数'}});deviceSelect.addEventListener('change',()=>{fitPhone();frame.contentWindow.requestAnimationFrame(()=>frame.contentWindow.requestAnimationFrame(()=>{if(state)applyLayout();else readInitial()}))});frame.addEventListener('load',()=>{fitPhone();frame.contentWindow.requestAnimationFrame(()=>frame.contentWindow.requestAnimationFrame(readInitial))});window.addEventListener('resize',fitPhone,{passive:true});fitPhone();if(frame.contentDocument?.readyState==='complete')readInitial();
  })();
  </script>
</body>
</html>
