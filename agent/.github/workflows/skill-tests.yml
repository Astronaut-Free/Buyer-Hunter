name: QianPulse Skill Tests

on:
  push:
    branches: [MVP, MVP-a2a6-runtime-fix]
    paths:
      - 'skill-runtime/**'
      - 'skills/**'
      - 'tests/**'
      - 'providers/**'
      - 'webhooks/**'
      - 'server/**'
      - 'db/**'
      - 'capability-adapter.js'
      - 'agent-skill-bridge.js'
      - 'external-action-executor.js'
      - 'opportunity-seeder.js'
      - 'opportunity-store.js'
      - 'qianpulse-*.js'
      - 'package.json'
      - '.github/workflows/skill-tests.yml'
  pull_request:
    paths:
      - 'skill-runtime/**'
      - 'skills/**'
      - 'tests/**'
      - 'providers/**'
      - 'webhooks/**'
      - 'server/**'
      - 'db/**'
      - 'capability-adapter.js'
      - 'agent-skill-bridge.js'
      - 'external-action-executor.js'
      - 'opportunity-seeder.js'
      - 'opportunity-store.js'
      - 'qianpulse-*.js'
      - 'package.json'
      - '.github/workflows/skill-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm test
