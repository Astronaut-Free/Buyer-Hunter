<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>黔脉 QianPulse｜最后一页手机编辑器</title>
  <style>
    :root{--green:#123b32;--warm:#f7f4ec;--gold:#d5a33f;--ink:#172720;--muted:#718079}*{box-sizing:border-box}html,body{width:100%;min-height:100%;margin:0}body{height:100vh;overflow:hidden;color:var(--ink);background:#e9eee9;font-family:ui-sans-serif,system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}button,input,select{font:inherit}.editor-header{height:64px;display:flex;align-items:center;gap:18px;padding:0 22px;color:#fff;background:var(--green);box-shadow:0 5px 18px rgba(0,25,18,.2)}.editor-brand{flex:1 1 auto;min-width:0}.editor-title{margin:0;font-size:17px;line-height:1.1}.editor-subtitle{margin:5px 0 0;color:rgba(255,255,255,.65);font-size:10px;letter-spacing:.04em}.device-picker{display:flex;align-items:center;gap:9px}.device-picker label{color:rgba(255,255,255,.72);font-size:12px}.device-select{height:38px;padding:0 34px 0 12px;color:var(--green);background:var(--warm);border:0;border-radius:9px;cursor:pointer;font-weight:700}.open-page{min-height:38px;display:inline-flex;align-items:center;padding:0 14px;color:#fff;border:1px solid rgba(255,255,255,.28);border-radius:9px;text-decoration:none;font-size:12px;font-weight:700}.workbench{height:calc(100vh - 64px);display:grid;grid-template-columns:minmax(0,1fr) 420px}.preview-stage{min-width:0;min-height:0;position:relative;display:grid;place-items:center;overflow:auto;padding:28px;background-color:#dfe6e1;background-image:linear-gradient(rgba(18,59,50,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(18,59,50,.06) 1px,transparent 1px);background-size:24px 24px}.phone-mount{position:relative;flex:0 0 auto}.phone-shell{position:absolute;left:0;top:0;padding:10px;background:#13231e;border-radius:28px;box-shadow:0 26px 64px rgba(8,32,25,.3),0 0 0 1px rgba(255,255,255,.1) inset;transform-origin:left top}.phone-shell::before{content:"";position:absolute;z-index:3;left:50%;top:4px;width:76px;height:17px;background:#13231e;border-radius:0 0 12px 12px;transform:translateX(-50%);pointer-events:none}.phone-frame{width:100%;height:100%;display:block;overflow:hidden;background:#173e33;border:0;border-radius:19px}.device-badge{position:absolute;left:18px;bottom:14px;padding:7px 10px;color:#dce9e1;background:rgba(18,59,50,.82);border:1px solid rgba(255,255,255,.16);border-radius:8px;font:600 10px/1 ui-monospace,SFMono-Regular,Menlo,monospace;pointer-events:none}.control-panel{min-width:0;overflow:auto;padding:16px;background:rgba(255,255,255,.98);border-left:1px solid rgba(18,59,50,.12);box-shadow:-10px 0 30px rgba(18,59,50,.08)}.panel-head{margin-bottom:12px}.panel-title{margin:0;color:var(--green);font-size:18px}.panel-copy{margin:6px 0 0;color:var(--muted);font-size:11px;line-height:1.55}.control-group{min-width:0;margin:0 0 10px;padding:11px 12px 12px;border:1px solid rgba(18,59,50,.13);border-radius:12px}.control-group legend{max-width:340px;padding:0 7px;overflow:hidden;color:var(--green);font-size:12px;font-weight:800;text-overflow:ellipsis;white-space:nowrap}.layout-group{background:#f7f4ec;border-color:rgba(213,163,63,.42)}.control-row{display:grid;grid-template-columns:78px minmax(0,1fr) 74px;align-items:center;gap:8px;min-height:34px}.control-row+.control-row{margin-top:6px}.control-row label{font-size:11px;font-weight:700}.control-row input[type="range"]{width:100%;accent-color:var(--gold);cursor:pointer}.number-wrap{position:relative}.number-input{width:100%;height:31px;padding:0 24px 0 7px;color:var(--green);background:#fff;border:1px solid rgba(18,59,50,.18);border-radius:7px;font:650 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace}.unit{position:absolute;right:7px;top:50%;color:#839089;font-size:9px;transform:translateY(-50%);pointer-events:none}.reset-button{min-height:33px;width:100%;margin-top:9px;color:var(--green);background:var(--warm);border:1px solid rgba(18,59,50,.13);border-radius:8px;cursor:pointer;font-size:10px;font-weight:750}.parameter-output{margin:5px 0 10px;padding:11px;max-height:220px;overflow:auto;color:#dce9e1;background:var(--green);border-radius:10px;font:9.5px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap}.panel-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding-bottom:12px}.panel-action{min-height:40px;color:var(--green);background:#fff;border:1px solid rgba(18,59,50,.17);border-radius:9px;cursor:pointer;font-size:11px;font-weight:800}.panel-action-primary{color:#fff;background:var(--green)}.copy-status{min-height:18px;margin:0;color:#688078;font-size:10px;text-align:center}@media(max-width:980px){body{height:auto;overflow:auto}.editor-header{height:auto;min-height:64px;flex-wrap:wrap;padding:12px 14px}.editor-brand{flex-basis:100%}.workbench{height:auto;min-height:calc(100vh - 96px);grid-template-columns:1fr}.preview-stage{height:72vh;min-height:580px}.control-panel{border-top:1px solid rgba(18,59,50,.12);border-left:0}}
  </style>
</head>
<body>
  <header class="editor-header"><div class="editor-brand"><h1 class="editor-title">主页面最后一页手机编辑器</h1><p class="editor-subtitle">单行标题、背景图片和行动按钮可视化调节</p></div><div class="device-picker"><label for="deviceSelect">手机尺寸</label><select class="device-select" id="deviceSelect"><option value="360x800">360 × 800</option><option value="390x844" selected>390 × 844</option><option value="393x852">393 × 852</option><option value="430x932">430 × 932</option></select></div><a class="open-page" href="opportunities.html#start-hunting" target="_blank" rel="noopener">打开普通主页面 ↗</a></header>
  <main class="workbench">
    <section class="preview-stage" id="previewStage" aria-label="主页面最后一页手机预览"><div class="phone-mount" id="phoneMount"><div class="phone-shell" id="phoneShell"><iframe class="phone-frame" id="phoneFrame" src="opportunities.html?final-preview=1#start-hunting" title="黔脉主页面最后一页手机预览"></iframe></div></div><span class="device-badge" id="deviceBadge">390 × 844</span></section>
    <aside class="control-panel" aria-label="主页面最后一页元素编辑器">
      <div class="panel-head"><h2 class="panel-title">最后一页布局参数</h2><p class="panel-copy">“准备好看看”独立成行；第二句无论字号如何调整都保持同一行。</p></div>
      <fieldset class="control-group layout-group"><legend>背景图片</legend><div class="control-row"><label for="sectionHeight">页面高度</label><input id="sectionHeight" data-control="sectionHeight" type="range" min="240" max="1000" step="1"><span class="number-wrap"><input class="number-input" data-number="sectionHeight" type="number" min="240" max="1000" step="1"><span class="unit">px</span></span></div><div class="control-row"><label for="imageScale">图片大小</label><input id="imageScale" data-control="imageScale" type="range" min="0.8" max="2" step="0.01"><span class="number-wrap"><input class="number-input" data-number="imageScale" type="number" min="0.8" max="2" step="0.01"><span class="unit">倍</span></span></div><div class="control-row"><label for="imagePositionX">水平焦点</label><input id="imagePositionX" data-control="imagePositionX" type="range" min="0" max="100" step="1"><span class="number-wrap"><input class="number-input" data-number="imagePositionX" type="number" min="0" max="100" step="1"><span class="unit">%</span></span></div><div class="control-row"><label for="imagePositionY">垂直焦点</label><input id="imagePositionY" data-control="imagePositionY" type="range" min="0" max="100" step="1"><span class="number-wrap"><input class="number-input" data-number="imagePositionY" type="number" min="0" max="100" step="1"><span class="unit">%</span></span></div><button class="reset-button" data-reset="background" type="button">重置背景图片</button></fieldset>
      <div id="textControlGroups"></div>
      <fieldset class="control-group layout-group"><legend>行动按钮</legend><div class="control-row"><label for="buttonX">水平偏移</label><input id="buttonX" data-control="buttonX" type="range" min="-180" max="180" step="1"><span class="number-wrap"><input class="number-input" data-number="buttonX" type="number" min="-180" max="180" step="1"><span class="unit">px</span></span></div><div class="control-row"><label for="buttonY">垂直偏移</label><input id="buttonY" data-control="buttonY" type="range" min="-180" max="180" step="1"><span class="number-wrap"><input class="number-input" data-number="buttonY" type="number" min="-180" max="180" step="1"><span class="unit">px</span></span></div><div class="control-row"><label for="buttonWidth">按钮宽度</label><input id="buttonWidth" data-control="buttonWidth" type="range" min="120" max="280" step="1"><span class="number-wrap"><input class="number-input" data-number="buttonWidth" type="number" min="120" max="280" step="1"><span class="unit">px</span></span></div><div class="control-row"><label for="buttonHeight">按钮高度</label><input id="buttonHeight" data-control="buttonHeight" type="range" min="48" max="90" step="1"><span class="number-wrap"><input class="number-input" data-number="buttonHeight" type="number" min="48" max="90" step="1"><span class="unit">px</span></span></div><div class="control-row"><label for="buttonSize">按钮字号</label><input id="buttonSize" data-control="buttonSize" type="range" min="10" max="24" step="0.5"><span class="number-wrap"><input class="number-input" data-number="buttonSize" type="number" min="10" max="24" step="0.5"><span class="unit">px</span></span></div><button class="reset-button" data-reset="button" type="button">重置按钮</button></fieldset>
      <pre class="parameter-output" id="parameterOutput" aria-live="polite">正在连接手机预览…</pre><div class="panel-actions"><button class="panel-action" id="resetAll" type="button">全部重置</button><button class="panel-action panel-action-primary" id="copyParameters" type="button">复制参数</button></div><p class="copy-status" id="copyStatus"></p>
    </aside>
  </main>
  <script>
  (()=>{
    const definitions=[
      {key:'titleLead',selector:'.qp-final-cta-title-line:first-child',label:'准备好看看，'},
      {key:'titleQuestion',selector:'.qp-final-cta-title-line:last-child',label:'谁正在寻找你的产品了吗？'},
      {key:'finalCopy',selector:'.qp-final-cta-copy',label:'辅助说明文字'}
    ];
    const frame=document.getElementById('phoneFrame'),stage=document.getElementById('previewStage'),mount=document.getElementById('phoneMount'),shell=document.getElementById('phoneShell'),deviceSelect=document.getElementById('deviceSelect'),deviceBadge=document.getElementById('deviceBadge'),parameterOutput=document.getElementById('parameterOutput'),copyStatus=document.getElementById('copyStatus');
    const groups={background:['sectionHeight','imageScale','imagePositionX','imagePositionY'],button:['buttonX','buttonY','buttonWidth','buttonHeight','buttonSize']};let state=null,initial=null,preview=null;
    const textGroups=document.getElementById('textControlGroups');definitions.forEach((definition,index)=>{const group=document.createElement('fieldset');group.className='control-group';group.innerHTML=`<legend>${index+1}. ${definition.label}</legend><div class="control-row"><label for="${definition.key}X">水平偏移</label><input id="${definition.key}X" data-control="${definition.key}X" type="range" min="-180" max="180" step="1"><span class="number-wrap"><input class="number-input" data-number="${definition.key}X" type="number" min="-180" max="180" step="1"><span class="unit">px</span></span></div><div class="control-row"><label for="${definition.key}Y">垂直偏移</label><input id="${definition.key}Y" data-control="${definition.key}Y" type="range" min="-180" max="180" step="1"><span class="number-wrap"><input class="number-input" data-number="${definition.key}Y" type="number" min="-180" max="180" step="1"><span class="unit">px</span></span></div><div class="control-row"><label for="${definition.key}Size">文字大小</label><input id="${definition.key}Size" data-control="${definition.key}Size" type="range" min="8" max="76" step="0.5"><span class="number-wrap"><input class="number-input" data-number="${definition.key}Size" type="number" min="8" max="76" step="0.5"><span class="unit">px</span></span></div><button class="reset-button" data-reset="${definition.key}" type="button">重置本组</button>`;textGroups.appendChild(group);groups[definition.key]=[`${definition.key}X`,`${definition.key}Y`,`${definition.key}Size`];});
    function getDevice(){const [width,height]=deviceSelect.value.split('x').map(Number);return{width,height}}
    function fitPhone(){const{width,height}=getDevice();shell.style.width=`${width+20}px`;shell.style.height=`${height+20}px`;frame.style.width=`${width}px`;frame.style.height=`${height}px`;const scale=Math.min(1,Math.max(280,stage.clientWidth-64)/(width+20),Math.max(500,stage.clientHeight-64)/(height+20));shell.style.transform=`scale(${scale})`;mount.style.width=`${(width+20)*scale}px`;mount.style.height=`${(height+20)*scale}px`;deviceBadge.textContent=`${width} × ${height} · ${Math.round(scale*100)}% 显示`}
    function getPreview(){const doc=frame.contentDocument;if(!doc)return null;const section=doc.querySelector('.qp-final-cta'),image=doc.querySelector('.qp-final-cta-image'),button=doc.querySelector('#qpGlassStart'),targets=Object.fromEntries(definitions.map(definition=>[definition.key,doc.querySelector(definition.selector)]));return section&&image&&button&&Object.values(targets).every(Boolean)?{doc,section,image,button,targets}:null}
    function installPreview(){preview=getPreview();if(!preview)return;let style=preview.doc.getElementById('qpFinalEditorStyle');if(!style){style=preview.doc.createElement('style');style.id='qpFinalEditorStyle';style.textContent=`.qp-product-gallery,.qp-demand-section,.qp-core-section,.qp-deal-section{display:none!important}.qp-final-cta-title-line{white-space:nowrap!important}.qp-final-cta-image,#qpGlassStart{transition:none!important}.qp-final-cta-title-line,.qp-final-cta-copy,#qpGlassStart{outline:1px dashed rgba(213,163,63,.95);outline-offset:3px}`;preview.doc.head.appendChild(style)}frame.contentWindow.scrollTo(0,Math.max(0,preview.section.offsetTop-60))}
    function numeric(element,property,fallback){const value=Number.parseFloat(frame.contentWindow.getComputedStyle(element).getPropertyValue(property));return Number.isFinite(value)?value:fallback}
    function translation(element){const value=frame.contentWindow.getComputedStyle(element).transform;if(!value||value==='none')return{x:0,y:0,scale:1};const Matrix=frame.contentWindow.DOMMatrixReadOnly||frame.contentWindow.DOMMatrix;if(!Matrix)return{x:0,y:0,scale:1};const matrix=new Matrix(value);return{x:Math.round(matrix.m41*10)/10,y:Math.round(matrix.m42*10)/10,scale:Math.round(matrix.a*1000)/1000}}
    function objectPosition(element){const parts=frame.contentWindow.getComputedStyle(element).objectPosition.split(/\s+/).map(value=>Number.parseFloat(value));return{x:Number.isFinite(parts[0])?parts[0]:50,y:Number.isFinite(parts[1])?parts[1]:54}}
    function readInitial(){preview=getPreview();if(!preview)return;installPreview();const imagePosition=objectPosition(preview.image),imageMove=translation(preview.image),buttonMove=translation(preview.button),buttonRect=preview.button.getBoundingClientRect();initial={sectionHeight:Math.round(preview.section.getBoundingClientRect().height),imageScale:imageMove.scale,imagePositionX:imagePosition.x,imagePositionY:imagePosition.y,buttonX:buttonMove.x,buttonY:buttonMove.y,buttonWidth:Math.round(buttonRect.width),buttonHeight:Math.round(buttonRect.height),buttonSize:Math.round(numeric(preview.button,'font-size',14)*10)/10};definitions.forEach(definition=>{const target=preview.targets[definition.key],move=translation(target);initial[`${definition.key}X`]=move.x;initial[`${definition.key}Y`]=move.y;initial[`${definition.key}Size`]=Math.round(numeric(target,'font-size',14)*10)/10});state={...initial};syncAll();applyLayout()}
    function applyLayout(){if(!state)return;preview=getPreview();if(!preview)return;installPreview();preview.section.style.setProperty('height',`${state.sectionHeight}px`,'important');preview.section.style.setProperty('min-height',`${state.sectionHeight}px`,'important');preview.image.style.setProperty('object-position',`${state.imagePositionX}% ${state.imagePositionY}%`,'important');preview.image.style.setProperty('transform',`translate3d(0,0,0) scale(${state.imageScale})`,'important');definitions.forEach(definition=>{const target=preview.targets[definition.key];target.style.setProperty('font-size',`${state[`${definition.key}Size`]}px`,'important');target.style.setProperty('transform',`translate3d(${state[`${definition.key}X`]}px,${state[`${definition.key}Y`]}px,0)`,'important')});preview.button.style.setProperty('width',`${state.buttonWidth}px`,'important');preview.button.style.setProperty('height',`${state.buttonHeight}px`,'important');preview.button.style.setProperty('font-size',`${state.buttonSize}px`,'important');preview.button.style.setProperty('transform',`translate3d(${state.buttonX}px,${state.buttonY}px,0)`,'important');const lines=[`最后一页  height:${state.sectionHeight}px;`,`背景图片  scale:${state.imageScale}; object-position:${state.imagePositionX}% ${state.imagePositionY}%;`];definitions.forEach(definition=>lines.push(`${definition.label}  font-size:${state[`${definition.key}Size`]}px; translate(${state[`${definition.key}X`]}px,${state[`${definition.key}Y`]}px);`));lines.push(`按钮  width:${state.buttonWidth}px; height:${state.buttonHeight}px; font-size:${state.buttonSize}px; translate(${state.buttonX}px,${state.buttonY}px);`);parameterOutput.textContent=lines.join('\n')}
    function sync(key,value){if(!state)return;state[key]=Number(value);const range=document.querySelector(`[data-control="${key}"]`),number=document.querySelector(`[data-number="${key}"]`);if(range)range.value=state[key];if(number)number.value=Math.round(state[key]*1000)/1000;applyLayout()}
    function syncAll(){Object.keys(state).forEach(key=>{const range=document.querySelector(`[data-control="${key}"]`),number=document.querySelector(`[data-number="${key}"]`);if(range)range.value=state[key];if(number)number.value=Math.round(state[key]*1000)/1000})}
    document.querySelectorAll('[data-control]').forEach(input=>input.addEventListener('input',()=>sync(input.dataset.control,input.value)));document.querySelectorAll('[data-number]').forEach(input=>input.addEventListener('input',()=>{if(input.value===''||!state)return;sync(input.dataset.number,Math.min(Number(input.max),Math.max(Number(input.min),Number(input.value))))}));document.querySelectorAll('[data-reset]').forEach(button=>button.addEventListener('click',()=>groups[button.dataset.reset].forEach(key=>sync(key,initial[key]))));document.getElementById('resetAll').addEventListener('click',()=>{state={...initial};syncAll();applyLayout();copyStatus.textContent='已恢复最后一页初始布局'});document.getElementById('copyParameters').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(parameterOutput.textContent);copyStatus.textContent='参数已复制'}catch{copyStatus.textContent='复制失败，请手动选择上方参数'}});deviceSelect.addEventListener('change',()=>{fitPhone();frame.contentWindow.requestAnimationFrame(()=>frame.contentWindow.requestAnimationFrame(()=>{if(state)applyLayout();else readInitial()}))});frame.addEventListener('load',()=>{fitPhone();frame.contentWindow.requestAnimationFrame(()=>frame.contentWindow.requestAnimationFrame(readInitial))});window.addEventListener('resize',fitPhone,{passive:true});fitPhone();if(frame.contentDocument?.readyState==='complete')readInitial();
  })();
  </script>
</body>
</html>
