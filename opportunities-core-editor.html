<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>黔脉 QianPulse｜第三页手机编辑器</title>
  <style>
    :root{--green:#123b32;--warm:#f7f4ec;--gold:#d5a33f;--ink:#172720;--muted:#718079}*{box-sizing:border-box}html,body{width:100%;min-height:100%;margin:0}body{height:100vh;overflow:hidden;color:var(--ink);background:#e9eee9;font-family:ui-sans-serif,system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}button,input,select{font:inherit}.editor-header{height:64px;display:flex;align-items:center;gap:18px;padding:0 22px;color:#fff;background:var(--green);box-shadow:0 5px 18px rgba(0,25,18,.2)}.editor-brand{flex:1 1 auto;min-width:0}.editor-title{margin:0;font-size:17px;line-height:1.1}.editor-subtitle{margin:5px 0 0;color:rgba(255,255,255,.65);font-size:10px;letter-spacing:.04em}.device-picker{display:flex;align-items:center;gap:9px}.device-picker label{color:rgba(255,255,255,.72);font-size:12px}.device-select{height:38px;padding:0 34px 0 12px;color:var(--green);background:var(--warm);border:0;border-radius:9px;cursor:pointer;font-weight:700}.open-page{min-height:38px;display:inline-flex;align-items:center;padding:0 14px;color:#fff;border:1px solid rgba(255,255,255,.28);border-radius:9px;text-decoration:none;font-size:12px;font-weight:700}.workbench{height:calc(100vh - 64px);display:grid;grid-template-columns:minmax(0,1fr) 410px}.preview-stage{min-width:0;min-height:0;position:relative;display:grid;place-items:center;overflow:auto;padding:28px;background-color:#dfe6e1;background-image:linear-gradient(rgba(18,59,50,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(18,59,50,.06) 1px,transparent 1px);background-size:24px 24px}.phone-mount{position:relative;flex:0 0 auto}.phone-shell{position:absolute;left:0;top:0;padding:10px;background:#13231e;border-radius:28px;box-shadow:0 26px 64px rgba(8,32,25,.3),0 0 0 1px rgba(255,255,255,.1) inset;transform-origin:left top}.phone-shell::before{content:"";position:absolute;z-index:3;left:50%;top:4px;width:76px;height:17px;background:#13231e;border-radius:0 0 12px 12px;transform:translateX(-50%);pointer-events:none}.phone-frame{width:100%;height:100%;display:block;overflow:hidden;background:#f7f4ec;border:0;border-radius:19px}.device-badge{position:absolute;left:18px;bottom:14px;padding:7px 10px;color:#dce9e1;background:rgba(18,59,50,.82);border:1px solid rgba(255,255,255,.16);border-radius:8px;font:600 10px/1 ui-monospace,SFMono-Regular,Menlo,monospace;pointer-events:none}.control-panel{min-width:0;overflow:auto;padding:16px;background:rgba(255,255,255,.98);border-left:1px solid rgba(18,59,50,.12);box-shadow:-10px 0 30px rgba(18,59,50,.08)}.panel-head{margin-bottom:12px}.panel-title{margin:0;color:var(--green);font-size:18px}.panel-copy{margin:6px 0 0;color:var(--muted);font-size:11px;line-height:1.55}.control-group{min-width:0;margin:0 0 10px;padding:11px 12px 12px;border:1px solid rgba(18,59,50,.13);border-radius:12px}.control-group legend{max-width:330px;padding:0 7px;overflow:hidden;color:var(--green);font-size:12px;font-weight:800;text-overflow:ellipsis;white-space:nowrap}.layout-group{background:#f7f4ec;border-color:rgba(213,163,63,.42)}.control-row{display:grid;grid-template-columns:72px minmax(0,1fr) 72px;align-items:center;gap:8px;min-height:34px}.control-row+.control-row{margin-top:6px}.control-row label{font-size:11px;font-weight:700}.control-row input[type="range"]{width:100%;accent-color:var(--gold);cursor:pointer}.number-wrap{position:relative}.number-input{width:100%;height:31px;padding:0 24px 0 7px;color:var(--green);background:#fff;border:1px solid rgba(18,59,50,.18);border-radius:7px;font:650 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace}.unit{position:absolute;right:7px;top:50%;color:#839089;font-size:9px;transform:translateY(-50%);pointer-events:none}.reset-button{min-height:33px;width:100%;margin-top:9px;color:var(--green);background:var(--warm);border:1px solid rgba(18,59,50,.13);border-radius:8px;cursor:pointer;font-size:10px;font-weight:750}.parameter-output{margin:5px 0 10px;padding:11px;max-height:220px;overflow:auto;color:#dce9e1;background:var(--green);border-radius:10px;font:9.5px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap}.panel-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding-bottom:12px}.panel-action{min-height:40px;color:var(--green);background:#fff;border:1px solid rgba(18,59,50,.17);border-radius:9px;cursor:pointer;font-size:11px;font-weight:800}.panel-action-primary{color:#fff;background:var(--green)}.copy-status{min-height:18px;margin:0;color:#688078;font-size:10px;text-align:center}@media(max-width:980px){body{height:auto;overflow:auto}.editor-header{height:auto;min-height:64px;flex-wrap:wrap;padding:12px 14px}.editor-brand{flex-basis:100%}.workbench{height:auto;min-height:calc(100vh - 96px);grid-template-columns:1fr}.preview-stage{height:72vh;min-height:580px}.control-panel{border-top:1px solid rgba(18,59,50,.12);border-left:0}}
  </style>
</head>
<body>
  <header class="editor-header"><div class="editor-brand"><h1 class="editor-title">主页面第三页手机编辑器</h1><p class="editor-subtitle">核心能力标题与网络模块可视化调节</p></div><div class="device-picker"><label for="deviceSelect">手机尺寸</label><select class="device-select" id="deviceSelect"><option value="360x800">360 × 800</option><option value="390x844" selected>390 × 844</option><option value="393x852">393 × 852</option><option value="430x932">430 × 932</option></select></div><a class="open-page" href="opportunities.html#core-capabilities" target="_blank" rel="noopener">打开普通主页面 ↗</a></header>
  <main class="workbench">
    <section class="preview-stage" id="previewStage" aria-label="主页面第三页手机预览"><div class="phone-mount" id="phoneMount"><div class="phone-shell" id="phoneShell"><iframe class="phone-frame" id="phoneFrame" src="opportunities.html?core-preview=1#core-capabilities" title="黔脉主页面第三页手机预览"></iframe></div></div><span class="device-badge" id="deviceBadge">390 × 844</span></section>
    <aside class="control-panel" aria-label="主页面第三页元素编辑器">
      <div class="panel-head"><h2 class="panel-title">第三页布局参数</h2><p class="panel-copy">逐组调整标题、辅助文字和核心网络模块。手机画布可以直接上下滚动检查完整第三页。</p></div>
      <fieldset class="control-group layout-group"><legend>核心网络模块</legend><div class="control-row"><label for="sectionPaddingTop">页面上边距</label><input id="sectionPaddingTop" data-control="sectionPaddingTop" type="range" min="0" max="120" step="1"><span class="number-wrap"><input class="number-input" data-number="sectionPaddingTop" type="number" min="0" max="120" step="1"><span class="unit">px</span></span></div><div class="control-row"><label for="stageMarginTop">模块上边距</label><input id="stageMarginTop" data-control="stageMarginTop" type="range" min="-80" max="120" step="1"><span class="number-wrap"><input class="number-input" data-number="stageMarginTop" type="number" min="-80" max="120" step="1"><span class="unit">px</span></span></div><div class="control-row"><label for="sideHeight">两侧高度</label><input id="sideHeight" data-control="sideHeight" type="range" min="180" max="420" step="1"><span class="number-wrap"><input class="number-input" data-number="sideHeight" type="number" min="180" max="420" step="1"><span class="unit">px</span></span></div><div class="control-row"><label for="engineSize">引擎大小</label><input id="engineSize" data-control="engineSize" type="range" min="160" max="320" step="1"><span class="number-wrap"><input class="number-input" data-number="engineSize" type="number" min="160" max="320" step="1"><span class="unit">px</span></span></div><button class="reset-button" data-reset="layout" type="button">重置网络模块</button></fieldset>
      <div id="textControlGroups"></div><pre class="parameter-output" id="parameterOutput" aria-live="polite">正在连接手机预览…</pre><div class="panel-actions"><button class="panel-action" id="resetAll" type="button">全部重置</button><button class="panel-action panel-action-primary" id="copyParameters" type="button">复制参数</button></div><p class="copy-status" id="copyStatus"></p>
    </aside>
  </main>
  <script>
  (()=>{
    const definitions=[
      {key:'coreKicker',transformSelector:'.qp-core-kicker',fontSelector:'.qp-core-kicker',label:'CORE CAPABILITIES'},
      {key:'coreTitle',transformSelector:'.qp-core-title',fontSelector:'.qp-core-title',label:'全球商机从哪里来'},
      {key:'coreIntro',transformSelector:'.qp-core-intro',fontSelector:'.qp-core-intro',label:'标题辅助文字'},
      {key:'demandRoute',transformSelector:'.qp-network-route-demand',fontSelector:'.qp-network-route-demand .qp-network-route-title',label:'全球需求捕捉'},
      {key:'buyerTitle',transformSelector:'.qp-network-buyers .qp-network-side-head',fontSelector:'.qp-network-buyers .qp-network-side-title',label:'全球买家网络'},
      {key:'buyerQuestion',transformSelector:'.qp-network-buyers .qp-network-question',fontSelector:'.qp-network-buyers .qp-network-question',label:'谁正在买？'},
      {key:'supplyTitle',transformSelector:'.qp-network-supply .qp-network-side-head',fontSelector:'.qp-network-supply .qp-network-side-title',label:'贵州供给网络'},
      {key:'supplyQuestion',transformSelector:'.qp-network-supply .qp-network-question',fontSelector:'.qp-network-supply .qp-network-question',label:'谁最适合供应？'},
      {key:'expandRoute',transformSelector:'.qp-network-route-expand',fontSelector:'.qp-network-route-expand .qp-network-route-title',label:'主动商机拓展'}
    ];
    const frame=document.getElementById('phoneFrame'),stage=document.getElementById('previewStage'),mount=document.getElementById('phoneMount'),shell=document.getElementById('phoneShell'),deviceSelect=document.getElementById('deviceSelect'),deviceBadge=document.getElementById('deviceBadge'),parameterOutput=document.getElementById('parameterOutput'),copyStatus=document.getElementById('copyStatus');
    const groups={layout:['sectionPaddingTop','stageMarginTop','sideHeight','engineSize']};let state=null,initial=null,preview=null;
    const textGroups=document.getElementById('textControlGroups');definitions.forEach((definition,index)=>{const group=document.createElement('fieldset');group.className='control-group';group.innerHTML=`<legend>${index+1}. ${definition.label}</legend><div class="control-row"><label for="${definition.key}X">水平偏移</label><input id="${definition.key}X" data-control="${definition.key}X" type="range" min="-180" max="180" step="1"><span class="number-wrap"><input class="number-input" data-number="${definition.key}X" type="number" min="-180" max="180" step="1"><span class="unit">px</span></span></div><div class="control-row"><label for="${definition.key}Y">垂直偏移</label><input id="${definition.key}Y" data-control="${definition.key}Y" type="range" min="-180" max="180" step="1"><span class="number-wrap"><input class="number-input" data-number="${definition.key}Y" type="number" min="-180" max="180" step="1"><span class="unit">px</span></span></div><div class="control-row"><label for="${definition.key}Size">文字大小</label><input id="${definition.key}Size" data-control="${definition.key}Size" type="range" min="8" max="76" step="0.5"><span class="number-wrap"><input class="number-input" data-number="${definition.key}Size" type="number" min="8" max="76" step="0.5"><span class="unit">px</span></span></div><button class="reset-button" data-reset="${definition.key}" type="button">重置本组</button>`;textGroups.appendChild(group);groups[definition.key]=[`${definition.key}X`,`${definition.key}Y`,`${definition.key}Size`];});
    function getDevice(){const [width,height]=deviceSelect.value.split('x').map(Number);return{width,height}}
    function fitPhone(){const{width,height}=getDevice();shell.style.width=`${width+20}px`;shell.style.height=`${height+20}px`;frame.style.width=`${width}px`;frame.style.height=`${height}px`;const scale=Math.min(1,Math.max(280,stage.clientWidth-64)/(width+20),Math.max(500,stage.clientHeight-64)/(height+20));shell.style.transform=`scale(${scale})`;mount.style.width=`${(width+20)*scale}px`;mount.style.height=`${(height+20)*scale}px`;deviceBadge.textContent=`${width} × ${height} · ${Math.round(scale*100)}% 显示`}
    function getPreview(){const doc=frame.contentDocument;if(!doc)return null;const section=doc.querySelector('.qp-core-section'),networkStage=doc.querySelector('.qp-network-stage'),engine=doc.querySelector('.qp-network-engine'),sides=[...doc.querySelectorAll('.qp-network-side')],targets=Object.fromEntries(definitions.map(definition=>[definition.key,{transform:doc.querySelector(definition.transformSelector),font:doc.querySelector(definition.fontSelector)}]));return section&&networkStage&&engine&&sides.length===2&&Object.values(targets).every(target=>target.transform&&target.font)?{doc,section,networkStage,engine,sides,targets}:null}
    function installPreview(){preview=getPreview();if(!preview)return;let style=preview.doc.getElementById('qpCoreEditorStyle');if(!style){style=preview.doc.createElement('style');style.id='qpCoreEditorStyle';style.textContent=`.qp-product-gallery,.qp-demand-section,.qp-deal-section,.qp-final-cta{display:none!important}.qp-core-section{min-height:100vh!important}.qp-core-section.qp-core-reveal .qp-network-stage{animation:none!important}.qp-core-kicker,.qp-core-title,.qp-core-intro,.qp-network-route-demand,.qp-network-route-expand,.qp-network-buyers .qp-network-side-head,.qp-network-supply .qp-network-side-head,.qp-network-question{outline:1px dashed rgba(213,163,63,.95);outline-offset:3px}`;preview.doc.head.appendChild(style)}frame.contentWindow.scrollTo(0,Math.max(0,preview.section.offsetTop-60))}
    function numeric(element,property,fallback){const value=Number.parseFloat(frame.contentWindow.getComputedStyle(element).getPropertyValue(property));return Number.isFinite(value)?value:fallback}
    function translation(element){const value=frame.contentWindow.getComputedStyle(element).transform;if(!value||value==='none')return{x:0,y:0};const Matrix=frame.contentWindow.DOMMatrixReadOnly||frame.contentWindow.DOMMatrix;if(!Matrix)return{x:0,y:0};const matrix=new Matrix(value);return{x:Math.round(matrix.m41*10)/10,y:Math.round(matrix.m42*10)/10}}
    function readInitial(){preview=getPreview();if(!preview)return;installPreview();initial={sectionPaddingTop:numeric(preview.section,'padding-top',58),stageMarginTop:numeric(preview.networkStage,'margin-top',40),sideHeight:Math.round(preview.sides[0].getBoundingClientRect().height),engineSize:Math.round(preview.engine.getBoundingClientRect().width)};definitions.forEach(definition=>{const target=preview.targets[definition.key],move=translation(target.transform);initial[`${definition.key}X`]=move.x;initial[`${definition.key}Y`]=move.y;initial[`${definition.key}Size`]=Math.round(numeric(target.font,'font-size',14)*10)/10});state={...initial};syncAll();applyLayout()}
    function applyLayout(){if(!state)return;preview=getPreview();if(!preview)return;installPreview();preview.section.style.setProperty('padding-top',`${state.sectionPaddingTop}px`,'important');preview.networkStage.style.setProperty('margin-top',`${state.stageMarginTop}px`,'important');preview.sides.forEach(side=>side.style.setProperty('height',`${state.sideHeight}px`,'important'));preview.engine.style.setProperty('width',`${state.engineSize}px`,'important');definitions.forEach(definition=>{const target=preview.targets[definition.key];target.font.style.setProperty('font-size',`${state[`${definition.key}Size`]}px`,'important');target.transform.style.setProperty('transform',`translate3d(${state[`${definition.key}X`]}px,${state[`${definition.key}Y`]}px,0)`,'important')});const lines=[`网络模块  padding-top:${state.sectionPaddingTop}px; margin-top:${state.stageMarginTop}px; side-height:${state.sideHeight}px; engine-size:${state.engineSize}px;`];definitions.forEach(definition=>lines.push(`${definition.label}  font-size:${state[`${definition.key}Size`]}px; translate(${state[`${definition.key}X`]}px,${state[`${definition.key}Y`]}px);`));parameterOutput.textContent=lines.join('\n')}
    function sync(key,value){if(!state)return;state[key]=Number(value);const range=document.querySelector(`[data-control="${key}"]`),number=document.querySelector(`[data-number="${key}"]`);if(range)range.value=state[key];if(number)number.value=Math.round(state[key]*10)/10;applyLayout()}
    function syncAll(){Object.keys(state).forEach(key=>{const range=document.querySelector(`[data-control="${key}"]`),number=document.querySelector(`[data-number="${key}"]`);if(range)range.value=state[key];if(number)number.value=Math.round(state[key]*10)/10})}
    document.querySelectorAll('[data-control]').forEach(input=>input.addEventListener('input',()=>sync(input.dataset.control,input.value)));document.querySelectorAll('[data-number]').forEach(input=>input.addEventListener('input',()=>{if(input.value===''||!state)return;sync(input.dataset.number,Math.min(Number(input.max),Math.max(Number(input.min),Number(input.value))))}));document.querySelectorAll('[data-reset]').forEach(button=>button.addEventListener('click',()=>groups[button.dataset.reset].forEach(key=>sync(key,initial[key]))));document.getElementById('resetAll').addEventListener('click',()=>{state={...initial};syncAll();applyLayout();copyStatus.textContent='已恢复第三页初始布局'});document.getElementById('copyParameters').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(parameterOutput.textContent);copyStatus.textContent='参数已复制'}catch{copyStatus.textContent='复制失败，请手动选择上方参数'}});deviceSelect.addEventListener('change',()=>{fitPhone();frame.contentWindow.requestAnimationFrame(()=>frame.contentWindow.requestAnimationFrame(()=>{if(state)applyLayout();else readInitial()}))});frame.addEventListener('load',()=>{fitPhone();frame.contentWindow.requestAnimationFrame(()=>frame.contentWindow.requestAnimationFrame(readInitial))});window.addEventListener('resize',fitPhone,{passive:true});fitPhone();if(frame.contentDocument?.readyState==='complete')readInitial();
  })();
  </script>
</body>
</html>
