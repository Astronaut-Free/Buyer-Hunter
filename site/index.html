  <script>
  (() => {
    const canvas=document.getElementById('lightfallCanvas');
    if(!canvas)return;
    const gl=canvas.getContext('webgl',{alpha:true,antialias:false,premultipliedAlpha:true});
    if(!gl){canvas.style.display='none';return;}

    const vertex=`
      attribute vec2 position;
      varying vec2 vUv;
      void main(){vUv=position*.5+.5;gl_Position=vec4(position,0.0,1.0);}
    `;
    const fragment=`
      precision highp float;
      uniform vec3 iResolution;
      uniform float iTime;
      uniform vec3 uColor0;
      uniform vec3 uColor1;
      uniform vec3 uColor2;
      uniform float uSpeed;
      uniform float uStreakWidth;
      uniform float uStreakLength;
      uniform float uGlow;
      uniform float uDensity;
      uniform float uTwinkle;
      uniform float uZoom;
      varying vec2 vUv;

      vec3 palette(float h){
        if(h<.48)return uColor0;
        if(h<.78)return uColor1;
        return uColor2;
      }
      vec3 tanhv(vec3 x){vec3 e=exp(-2.0*x);return(1.0-e)/(1.0+e);}
      vec2 sceneC(vec2 frag,vec2 r){
        vec2 P=(frag+frag-r)/r.x;
        float z=0.0,d=1e3;
        vec4 O=vec4(0.0);
        for(int k=0;k<39;k++){
          if(d<=1e-4)break;
          O=z*normalize(vec4(P,uZoom,0.0))-vec4(0.0,4.0,1.0,0.0)/4.5;
          d=1.0-sqrt(length(O*O));
          z+=d;
        }
        return vec2(O.x,atan(O.z,O.y));
      }
      void mainImage(out vec4 o,vec2 C){
        vec2 r=iResolution.xy;
        float screenX=C.x/r.x;
        float T=.1*iTime*uSpeed+9.0;
        float angRings=max(1.0,floor(6.28318530718*max(uDensity,.05)+.5));
        vec2 Y=vec2(5e-3,6.28318530718/angRings);
        vec2 c0=sceneC(C,r);
        vec2 cdx=sceneC(C+vec2(1.0,0.0),r);
        vec2 cdy=sceneC(C+vec2(0.0,1.0),r);
        vec2 dCx=cdx-c0,dCy=cdy-c0;
        dCx.y-=6.28318530718*floor(dCx.y/6.28318530718+.5);
        dCy.y-=6.28318530718*floor(dCy.y/6.28318530718+.5);
        vec2 fw=abs(dCx)+abs(dCy);
        C=c0;
        vec4 O=vec4(0.0);
        float zr=5e-4*uStreakWidth;
        vec2 rr=vec2(max(length(fw),1e-5));
        float tail=19.0/max(uStreakLength,.05);
        for(int m=0;m<3;m++){
          float jf=float(m)+1.0;
          float ic=fract(sin(dot(vec2(jf,floor(C.x/Y.x+.5)),vec2(7.0,11.0))*73.0));
          vec2 Pp=C-(T+T*ic)*vec2(0.0,1.0);
          Pp-=floor(Pp/Y+.5)*Y;
          float h=fract(8663.0*ic);
          vec3 col=palette(h);
          float weight=mix(1.25,.88+sin(T+7.0*h+4.0),uTwinkle);
          if(m==2)weight*=mix(.44,.12,smoothstep(.12,.88,screenX));
          vec2 inner=vec2(length(max(Pp,vec2(-1.0,0.0))),length(Pp)-zr)-zr;
          vec2 sm=vec2(1.0)-smoothstep(-rr,rr,inner);
          O.rgb+=dot(sm,vec2(exp(tail*Pp.y),2.45))*col*weight;
          C.x+=Y.x/8.0;
        }
        vec3 colr=sqrt(tanhv(max(O.rgb*uGlow-vec3(.04,.08,.02),0.0)));
        o=vec4(colr,.78);
      }
      void main(){vec4 color;mainImage(color,vUv*iResolution.xy);gl_FragColor=color;}
    `;
    function compile(type,source){
      const shader=gl.createShader(type);gl.shaderSource(shader,source);gl.compileShader(shader);
      if(!gl.getShaderParameter(shader,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(shader)||'Lightfall shader error');
      return shader;
    }
    let program;
    try{
      program=gl.createProgram();
      gl.attachShader(program,compile(gl.VERTEX_SHADER,vertex));
      gl.attachShader(program,compile(gl.FRAGMENT_SHADER,fragment));
      gl.linkProgram(program);
      if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(program)||'Lightfall link error');
    }catch(error){console.warn(error);canvas.style.display='none';return;}
    gl.useProgram(program);
    const buffer=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buffer);
    gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
    const position=gl.getAttribLocation(program,'position');
    gl.enableVertexAttribArray(position);gl.vertexAttribPointer(position,2,gl.FLOAT,false,0,0);
    const uniform=name=>gl.getUniformLocation(program,name);
    const resolution=uniform('iResolution'),time=uniform('iTime');
    const rgb=hex=>{const n=parseInt(hex.slice(1),16);return[((n>>16)&255)/255,((n>>8)&255)/255,(n&255)/255];};
    gl.uniform3fv(uniform('uColor0'),rgb('#68B493'));
    gl.uniform3fv(uniform('uColor1'),rgb('#F7F4EC'));
    gl.uniform3fv(uniform('uColor2'),rgb('#D5A33F'));
    gl.uniform1f(uniform('uSpeed'),.42);
    gl.uniform1f(uniform('uStreakWidth'),.34);
    gl.uniform1f(uniform('uStreakLength'),.9);
    gl.uniform1f(uniform('uGlow'),.72);
    gl.uniform1f(uniform('uDensity'),.22);
    gl.uniform1f(uniform('uTwinkle'),.46);
    gl.uniform1f(uniform('uZoom'),3.7);
    function resize(){
      const rect=canvas.getBoundingClientRect(),scale=.68;
      const width=Math.max(1,Math.round(rect.width*scale)),height=Math.max(1,Math.round(rect.height*scale));
      if(canvas.width!==width||canvas.height!==height){canvas.width=width;canvas.height=height;gl.viewport(0,0,width,height);gl.uniform3f(resolution,width,height,1);}
    }
    const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
    let last=0,raf=0;
    function draw(now){
      raf=requestAnimationFrame(draw);
      if(document.hidden||(!reduced&&now-last<33))return;
      last=now;resize();gl.uniform1f(time,reduced?12:now*.001);gl.drawArrays(gl.TRIANGLES,0,3);
    }
    raf=requestAnimationFrame(draw);
    addEventListener('resize',resize,{passive:true});
  })();
  </script>
  <script>
  (() => {
    const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
    function addLivingShine(button,speed=.34){
      if(!button)return;
      let pointerAngle=null,proximity=0,angle=2.4,idle=2.4,last=performance.now();
      addEventListener('pointermove',e=>{
        const rect=button.getBoundingClientRect(),cx=rect.left+rect.width/2,cy=rect.top+rect.height/2;
        const dx=Math.max(rect.left-e.clientX,0,e.clientX-rect.right),dy=Math.max(rect.top-e.clientY,0,e.clientY-rect.bottom);
        const distance=Math.hypot(dx,dy),nx=(e.clientX-cx)/(rect.width/2),ny=(cy-e.clientY)/(rect.height/2);
        pointerAngle=distance===0?Math.atan2(2/rect.height,-2/rect.width)+nx*.3+ny*.15:Math.atan2(cy-e.clientY,e.clientX-cx);
        const t=Math.max(0,1-distance/240);proximity=t*t*(3-2*t);
      },{passive:true});
      function frame(now){
        const dt=Math.min((now-last)/1000,.05);last=now;
        if(!reduced)idle+=speed*dt;
        const target=pointerAngle!==null&&proximity>0?pointerAngle:idle;
        const diff=((target-angle+Math.PI*3)%(Math.PI*2))-Math.PI;angle+=diff*(1-Math.exp(-dt*7));
        button.style.setProperty('--shine-angle',`${angle}rad`);
        button.style.setProperty('--shine-opacity',String(.24+proximity*.76));
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    }
    addLivingShine(document.getElementById('loginButton'));
    addLivingShine(document.getElementById('heroCta'),.46);
  })();
  </script>
  <script>
  (() => {
    const globe=document.querySelector('.globe-wrap');
    try{
      if(localStorage.getItem('qianpulse-globe-layout-version')!=='down-67-v2'){
        localStorage.setItem('qianpulse-globe-y','67');localStorage.setItem('qianpulse-globe-layout-version','down-67-v2');

  <script>
  (() => {

    const sizeInput=document.getElementById('textSize'),sizeOutput=document.getElementById('textSizeOutput');
    const globeVertical=document.getElementById('globeVertical'),globeVerticalOutput=document.getElementById('globeVerticalOutput');
    const cta=document.getElementById('heroCta'),ctaDefault=[50,43];

    let selected=null;
    function syncCtaFont(){cta.style.fontSize=getComputedStyle(tagline).fontSize;}
    function setPosition(item,x,y,save=false){
      x=Math.min(140,Math.max(-40,x));y=Math.min(140,Math.max(-40,y));

    function setSize(item,value,save=false){

    function setCtaPosition(x,y,save=false){

      item.addEventListener('pointerdown',e=>{
        selectItem(item);item.classList.add('is-dragging');

    });

    const stopCta=e=>{
      if(!drag||drag.item!==cta)return;

    };
    cta.addEventListener('pointerup',stopCta);cta.addEventListener('pointercancel',stopCta);
    document.getElementById('textEditorToggle').addEventListener('click',e=>{
      const collapsed=editor.classList.toggle('is-collapsed');e.currentTarget.setAttribute('aria-expanded',String(!collapsed));
    });
    sizeInput.addEventListener('input',e=>{if(selected)setSize(selected,e.target.value,true);});
    const initialGlobeY=parseFloat(getComputedStyle(globe).getPropertyValue('--globe-y'))||67;
    globeVertical.value=String(initialGlobeY);globeVerticalOutput.value=`${initialGlobeY}%`;
    globeVertical.addEventListener('input',e=>{
      const y=Math.min(95,Math.max(10,Number(e.target.value)||67));
      globe.style.setProperty('--globe-y',`${y}%`);globeVerticalOutput.value=`${y}%`;
      try{localStorage.setItem('qianpulse-globe-y',String(y));}catch{}
    });
    document.getElementById('textReset').addEventListener('click',()=>{
      items.forEach(item=>{
        const key=item.dataset.textKey;setPosition(item,...defaults[key],true);item.style.removeProperty('--text-size');
        try{localStorage.removeItem(`qianpulse-text-${key}-size`);}catch{}
      });
      setCtaPosition(...ctaDefault,true);globe.style.setProperty('--globe-y','67%');globeVertical.value='67';globeVerticalOutput.value='67%';syncCtaFont();
      try{localStorage.setItem('qianpulse-globe-y','67');}catch{}
      selectItem(items[0]);status.textContent='已恢复推荐布局与字号';
    });
    new ResizeObserver(syncCtaFont).observe(tagline);syncCtaFont();
    selectItem(items[0]);
  })();

  <script>
  (() => {
    const DATA_URL='assets/countries-50m.json';
    const FALLBACK_DATA_URL='assets/countries-110m.json';
    const CHINA_POV_URL='assets/china-pov-10m.geojson';
    const canvas=document.getElementById('globe'), ctx=canvas.getContext('2d');
    const guizhouLabel=document.getElementById('guizhouLabel');
    const fallback=document.getElementById('fallback');
    const dpr=Math.min(devicePixelRatio||1,2), reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
    const guizhou=[106.71,26.58];
    const southChinaSeaIslands=[
      [116.72,20.70],[112.25,16.84],[111.62,16.50],[112.72,16.05],[114.30,15.75],[115.80,15.10],
      [112.22,10.25],[113.80,10.02],[114.30,9.72],[115.52,10.78],[116.18,9.62],[112.92,8.62],
      [114.12,8.88],[115.82,7.82],[113.72,6.32],[116.88,5.52],[111.68,7.90],[117.05,11.05]
    ];
    const hubs=[[-74,40],[2,49],[13,52],[55,25],[77,28],guizhou,[121,31],[139,35],[151,-33],[-46,-23],[-99,19],[31,-1]];
    const routes=[[0,5],[1,5],[2,5],[3,5],[4,5],[5,6],[5,7],[5,8],[5,9],[5,10],[5,11],[1,8],[0,9],[2,7]];
    const maskW=1440,maskH=720;
    let landPixels=null, chinaPolygons=[], start=0, ready=false;

    function decodeTopology(topology){
      const cache=new Map(), tr=topology.transform;
      function arc(index){
        const reverse=index<0, key=reverse?~index:index;
        if(!cache.has(key)){
          let x=0,y=0;
          cache.set(key,topology.arcs[key].map(([dx,dy])=>{
            x+=dx;y+=dy; return [x*tr.scale[0]+tr.translate[0],y*tr.scale[1]+tr.translate[1]];
          }));
        }
        const points=cache.get(key); return reverse?[...points].reverse():points;
      }
      function ring(ids){
        const out=[]; ids.forEach((id,i)=>{const a=arc(id);out.push(...(i?a.slice(1):a));}); return out;
      }
      function polygons(g){
        if(g.type==='Polygon') return [g.arcs.map(ring)];
        if(g.type==='MultiPolygon') return g.arcs.map(poly=>poly.map(ring));
        return [];
      }
      return topology.objects.countries.geometries.map(g=>({id:String(g.id),polygons:polygons(g)}));
    }
    function chinaPovPolygons(geojson){
      if(!geojson||!Array.isArray(geojson.features))return [];
      const polygons=[];
      const simplifyRing=ring=>{
        if(ring.length<=900)return ring;
        const step=Math.ceil(ring.length/900),simplified=[];
        for(let i=0;i<ring.length;i+=step)simplified.push(ring[i]);
        const last=ring[ring.length-1];if(simplified[simplified.length-1]!==last)simplified.push(last);
        return simplified;
      };
      const simplifyPolygon=polygon=>polygon.map(simplifyRing);
      for(const feature of geojson.features){
        const properties=feature.properties||{};
        if(properties.SOVEREIGNT!=='China'&&properties.ADMIN!=='China')continue;
        const geometry=feature.geometry;if(!geometry)continue;
        if(geometry.type==='Polygon')polygons.push(simplifyPolygon(geometry.coordinates));
        if(geometry.type==='MultiPolygon')polygons.push(...geometry.coordinates.map(simplifyPolygon));
      }
      return polygons;
    }
    function unwrap(ring){
      if(!ring.length)return ring;
      const out=[[ring[0][0],ring[0][1]]];
      for(let i=1;i<ring.length;i++){
        let lon=ring[i][0],prev=out[i-1][0];
        while(lon-prev>180)lon-=360; while(lon-prev<-180)lon+=360;
        out.push([lon,ring[i][1]]);
      }
      return out;
    }
    function prepare(countries,preferredChinaPolygons=[]){
      const land=document.createElement('canvas');land.width=maskW;land.height=maskH;
      const m=land.getContext('2d');m.fillStyle='#fff';
      function paintPolygons(polygons){for(const poly of polygons){
        for(const shift of [-360,0,360]){
          m.beginPath();
          for(const rawRing of poly){
            const ring=unwrap(rawRing);
            ring.forEach(([lon,lat],i)=>{
              const x=(lon+shift+180)/360*maskW,y=(90-lat)/180*maskH;
              i?m.lineTo(x,y):m.moveTo(x,y);
            });
            m.closePath();
          }
          m.fill('evenodd');
        }
      }}
      for(const country of countries)paintPolygons(country.polygons);
      if(preferredChinaPolygons.length)paintPolygons(preferredChinaPolygons);
      landPixels=m.getImageData(0,0,maskW,maskH).data;
      // 中国大陆、台湾、香港和澳门均使用同一强调轮廓。
      const chinaIds=new Set(['156','158','344','446']);
      chinaPolygons=preferredChinaPolygons.length?preferredChinaPolygons:countries.filter(c=>chinaIds.has(c.id)).flatMap(c=>c.polygons);
    }
    function project(lon,lat,center,R,cx,cy){
      const lam=(lon-center)*Math.PI/180,phi=lat*Math.PI/180;
      return {x:cx+R*Math.cos(phi)*Math.sin(lam),y:cy-R*Math.sin(phi),z:Math.cos(phi)*Math.cos(lam)};
    }
    function globeLine(points,center,R,cx,cy,color,width=1){
      ctx.beginPath();let pen=false;
      for(const p of points){const q=project(p[0],p[1],center,R,cx,cy);if(q.z<=.01){pen=false;continue;}if(!pen){ctx.moveTo(q.x,q.y);pen=true;}else ctx.lineTo(q.x,q.y);}
      ctx.strokeStyle=color;ctx.lineWidth=width;ctx.stroke();
    }
    function route(a,b,center,R,cx,cy){
      const pts=[];
      for(let i=0;i<=48;i++){
        const t=i/48,lon=a[0]+(b[0]-a[0])*t,lat=a[1]+(b[1]-a[1])*t+Math.sin(Math.PI*t)*18;
        pts.push([lon,lat]);
      }
      ctx.setLineDash([2,5]);globeLine(pts,center,R,cx,cy,'rgba(209,215,136,.67)',1.1);ctx.setLineDash([]);
    }
    function drawSouthChinaSeaIslands(center,R,cx,cy){
      ctx.save();ctx.fillStyle='rgba(224,230,165,.96)';ctx.strokeStyle='rgba(213,163,63,.62)';ctx.lineWidth=.65;
      southChinaSeaIslands.forEach(([lon,lat],index)=>{
        const q=project(lon,lat,center,R,cx,cy);if(q.z<=.02)return;
        const size=Math.max(1.15,R*(index<6?.0038:.0031))*Math.max(.72,q.z);
        ctx.beginPath();ctx.ellipse(q.x,q.y,size,size*.62,(index%4-.5)*.18,0,Math.PI*2);ctx.fill();ctx.stroke();
      });
      ctx.restore();
    }
    function draw(now){
      if(!ready)return;
      if(!start)start=now;
      const rect=canvas.getBoundingClientRect();
      canvas.width=Math.round(rect.width*dpr);canvas.height=Math.round(rect.height*dpr);
      ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,rect.width,rect.height);
      const W=rect.width,H=rect.height,R=Math.min(W,H)*.445,cx=W*.5,cy=H*.5;
      const elapsed=now-start;
      let p=1,center=106.71,resting=true;
      if(!reduce){
        if(elapsed<3500){
          resting=false;const raw=Math.min(1,elapsed/3500);p=1-Math.pow(1-raw,3);center=-92+198.71*p;
        }else{
          const cycle=(elapsed-3500)%8500;
          if(cycle>=5000){
            resting=false;const raw=(cycle-5000)/3500;p=1-Math.pow(1-raw,3);center=106.71+360*p;
          }
        }
      }
      const glow=ctx.createRadialGradient(cx,cy,R*.1,cx,cy,R*1.18);
      glow.addColorStop(0,'rgba(72,141,101,.12)');glow.addColorStop(.72,'rgba(5,54,39,.1)');glow.addColorStop(1,'rgba(2,37,28,0)');
      ctx.fillStyle=glow;ctx.beginPath();ctx.arc(cx,cy,R*1.05,0,Math.PI*2);ctx.fill();
      ctx.save();ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);ctx.clip();
      // 在球面屏幕坐标中反投影取样，海岸线和所有岛屿来自真实地图蒙版。
      const step=Math.max(3.5,R/112);
      for(let sy=-R;sy<=R;sy+=step){
        const span=Math.sqrt(Math.max(0,R*R-sy*sy));
        for(let sx=-span;sx<=span;sx+=step){
          const nx=sx/R,ny=sy/R,z=Math.sqrt(Math.max(0,1-nx*nx-ny*ny));
          let lon=center+Math.atan2(nx,z)*180/Math.PI;
          lon=((lon+180)%360+360)%360-180;
          const lat=-Math.asin(ny)*180/Math.PI;
          const mx=Math.min(maskW-1,Math.max(0,Math.floor((lon+180)/360*maskW)));
          const my=Math.min(maskH-1,Math.max(0,Math.floor((90-lat)/180*maskH)));
          if(landPixels[(my*maskW+mx)*4+3]<128)continue;
          const size=.9+1.35*z;ctx.fillStyle=`rgba(207,220,154,${.22+.64*z})`;ctx.fillRect(cx+sx-size/2,cy+sy-size/2,size,size);
        }
      }
      routes.forEach(([a,b])=>route(hubs[a],hubs[b],center,R,cx,cy));
      chinaPolygons.forEach(poly=>poly.forEach(r=>globeLine(r,center,R,cx,cy,'rgba(224,230,165,.92)',1.35)));
      drawSouthChinaSeaIslands(center,R,cx,cy);
      hubs.forEach((h,i)=>{const q=project(h[0],h[1],center,R,cx,cy);if(q.z<=0)return;ctx.beginPath();ctx.arc(q.x,q.y,i===5?6:4.5,0,Math.PI*2);ctx.fillStyle=i===5?'#efb33f':'#dce9cf';ctx.fill();});
      const g=project(guizhou[0],guizhou[1],center,R,cx,cy);
      if(g.z>0){
        guizhouLabel.style.left=`${g.x}px`;guizhouLabel.style.top=`${g.y}px`;
        const signal=Math.max(0,(p-.72)/.28);ctx.save();ctx.translate(g.x,g.y);
        for(let i=0;i<4;i++){ctx.beginPath();ctx.arc(0,0,16+i*8+signal*9,0,Math.PI*2);ctx.strokeStyle=`rgba(213,163,63,${.65-i*.11})`;ctx.lineWidth=1.2;ctx.stroke();}
        ctx.beginPath();ctx.arc(0,0,8.5,0,Math.PI*2);ctx.fillStyle='#f0b53c';ctx.fill();ctx.restore();
      }
      guizhouLabel.classList.toggle('is-visible',resting&&g.z>0);
      ctx.restore();ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);ctx.strokeStyle='rgba(187,214,166,.16)';ctx.stroke();
      if(!reduce)requestAnimationFrame(draw);
    }
    const fetchJson=url=>fetch(url).then(r=>{if(!r.ok)throw Error(r.status);return r.json();});
    const worldData=fetchJson(DATA_URL).catch(()=>fetchJson(FALLBACK_DATA_URL));
    const chinaPov=fetchJson(CHINA_POV_URL).then(chinaPovPolygons).catch(()=>[]);
    worldData.then(data=>{
      const countries=decodeTopology(data);prepare(countries);ready=true;requestAnimationFrame(draw);
      chinaPov.then(preferredChinaPolygons=>{if(preferredChinaPolygons.length)prepare(countries,preferredChinaPolygons);});
    }).catch(()=>{
      canvas.style.display='none';fallback.style.display='block';
      guizhouLabel.style.left='75%';guizhouLabel.style.top='53%';guizhouLabel.classList.add('is-visible');
    });
  })();
