<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>买家猎手</title>
<style>
:root{--green:#126247;--ink:#24352d;--muted:#7c8780;--line:#e7e9e3;--paper:#fffefa;--slot:#dfe5df}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#cfcfcd;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.canvas{width:min(1900px,100%);margin:0 auto;padding:28px 34px;background:#d4d3d1;min-height:100vh}.background-slot{height:790px;background:#dfe4df;position:relative;display:grid;place-items:center;color:#8c9990;letter-spacing:1.5px;font-size:12px}.paper{position:relative;width:min(1490px,calc(100% - 150px));margin:-670px auto 0;padding:20px 20px 50px;background:var(--paper);box-shadow:0 14px 38px #142d211c;z-index:2}.hero-slot{height:605px;position:relative;overflow:hidden;border-radius:7px;background:#d8e0da;display:grid;place-items:center;color:#849289;font-size:12px;letter-spacing:1.4px}.hero-slot:before{content:"主视觉图片预留区"}.nav{position:absolute;z-index:3;left:20px;right:20px;top:19px;height:58px;display:flex;align-items:center;gap:18px;color:#fff;background:#173c2ed9;border-radius:6px;padding:0 18px}.logo{font-weight:800;font-size:19px;white-space:nowrap}.logo small{display:block;color:#c4d8cb;font-size:8px;letter-spacing:1.2px}.links{display:flex;gap:4px;flex:1}.links button{border:0;background:transparent;color:#dbe8df;padding:8px 10px}.links button.active{background:#f5f5f0;color:#46534c;border-radius:4px}.search{width:220px;border:0;background:#f3f5f1;border-radius:18px;padding:9px 13px}.circle{width:36px;height:36px;border:1px solid #fff6;background:#fff2;border-radius:50%;color:#fff}.intro{position:absolute;z-index:3;left:18px;top:45%;background:#f4f5f2ed;border-radius:7px;padding:20px 24px;width:455px;color:#5c635e;box-shadow:0 8px 18px #0002}.intro small{color:var(--green);font-size:10px;font-weight:800;letter-spacing:1.3px}.intro h1{font-size:33px;line-height:1.22;margin:7px 0 0}.hero-copy{position:absolute;z-index:3;left:25px;bottom:30px;color:#fff;width:470px}.hero-copy p{color:#e0ebe3;line-height:1.6}.cta{border:0;background:#f3e5b3;color:#20372b;padding:10px 15px;border-radius:20px;font-weight:800}.float{position:absolute;z-index:3;right:34px;bottom:30px;background:#173d2fe8;color:#fff;border:1px solid #fff5;border-radius:7px;padding:14px;width:180px}.float small{color:#ccded3}.float b{display:block;color:#fff2c4;font-size:34px}.float em{font-size:11px;font-style:normal;color:#d3e6da}.section{padding:52px 8px 0}.section-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:16px}.section h2{font-size:26px;margin:0}.section-head p{color:var(--muted);margin:4px 0 0}.filters{display:flex;gap:7px}.filters button{border:1px solid var(--line);background:#fff;border-radius:5px;padding:7px 10px;color:var(--muted)}.filters .active{background:#e7f0e8;color:var(--green);border-color:#b8d2be;font-weight:800}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{border:1px solid var(--line);border-radius:7px;overflow:hidden;background:#fff;cursor:pointer;transition:.25s}.card:hover,.card.selected{transform:translateY(-6px);box-shadow:0 16px 28px #1631261c;border-color:#a8cbb2}.card-image{height:170px;background:var(--slot);display:grid;place-items:center;color:#93a198;font-size:11px;letter-spacing:1px;position:relative}.card-image:before{content:"图片预留"}.status{position:absolute;left:12px;top:12px;background:#fffde5d9;color:var(--green);padding:4px 8px;border-radius:13px;font-size:10px;font-weight:800}.status.risk{color:#a84b40;background:#fdeae5}.status.warn{color:#93691f;background:#fff0d2}.card-score{position:absolute;right:12px;top:12px;border-radius:50%;width:42px;height:42px;background:#fffffff0;color:var(--green);display:grid;place-items:center;font-weight:900}.card-body{padding:13px}.dots{display:flex;gap:5px}.dots i{width:12px;height:12px;border-radius:50%;background:#8ab29e}.dots i:nth-child(2){background:#d9b66a}.dots i:nth-child(3){background:#789386}.card h3{font-size:16px;line-height:1.35;margin:9px 0 5px;min-height:43px}.card p{font-size:12px;color:var(--muted);min-height:36px;margin:0}.card-foot{display:flex;justify-content:space-between;border-top:1px solid var(--line);margin-top:10px;padding-top:9px;align-items:center}.card-foot b{font-size:15px}.card-foot button{border:0;background:var(--green);color:#fff;border-radius:17px;padding:7px 11px}.details{display:none;margin-top:22px;padding:20px;background:#f5f8f3;border:1px solid var(--line);border-radius:7px}.details.show{display:grid;grid-template-columns:1.15fr .85fr;gap:20px}.details h2{margin:4px 0;font-size:24px}.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.facts div{background:#fff;border-radius:5px;padding:9px;font-size:11px}.facts small{display:block;color:var(--muted)}.decision{background:#fff;border:1px solid var(--line);border-radius:6px;padding:14px}.decision b{font-size:30px;color:var(--green)}.risk-box{background:#fff4db;border:1px solid #eed6a0;padding:9px;border-radius:5px;color:#76591e;font-size:12px;margin:10px 0}.decision button{width:100%;border:0;background:var(--green);color:#fff;padding:10px;border-radius:5px;font-weight:800}.banner-slot{height:280px;margin-top:55px;background:#e3e8e2;display:grid;place-items:center;color:#8a978e;font-size:12px;letter-spacing:1px;position:relative}.banner-slot:before{content:"宽幅叙事图片预留区"}.banner-copy{position:absolute;left:20px;bottom:20px;background:#f5f5f1e8;padding:14px 17px;border-radius:6px;color:#5b635d;font-size:20px;font-weight:800}.pillars{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:40px 0}.pillar{background:#f0f1e5;border-radius:7px 35px 35px 7px;padding:20px;font-weight:800}.pillar i{font-style:normal;color:var(--green);font-size:20px;margin-right:12px}.toast{position:fixed;bottom:25px;right:25px;background:#15362a;color:#fff;border-radius:5px;padding:11px 15px;opacity:0;transition:.2s}.toast.show{opacity:1}@media(max-width:1000px){.paper{width:calc(100% - 40px)}.cards{grid-template-columns:repeat(2,1fr)}.links{display:none}.search{margin-left:auto}.details.show{grid-template-columns:1fr}}@media(max-width:620px){body{background:#fff}.canvas{padding:0;background:#fff}.background-slot{display:none}.paper{width:100%;margin:0;padding:0 0 30px;box-shadow:none}.hero-slot{height:600px;border-radius:0}.nav{top:12px;left:12px;right:12px}.search,.circle{display:none}.intro{top:150px;left:18px;width:calc(100% - 36px)}.intro h1{font-size:27px}.hero-copy{left:20px;right:20px;width:auto;bottom:22px}.float{right:18px;bottom:18px;width:150px}.section{padding:33px 16px 0}.section-head{display:block}.filters{margin-top:12px;overflow:auto}.cards{grid-template-columns:1fr}.card-image{height:130px}.details{margin:20px 16px 0}.details.show{display:block}.facts,.pillars{grid-template-columns:1fr}.banner-slot{height:230px}.banner-copy{font-size:16px;max-width:80%}}
</style></head><body><main class="canvas"><div class="background-slot">背景图片预留区</div><div class="paper"><section class="hero-slot"><nav class="nav"><div class="logo">买家猎手<small>BUYING MOMENT ENGINE</small></div><div class="links"><button class="active">首页</button><button>机会雷达</button><button>产品库</button><button>市场准入</button><button>关于我们</button></div><input class="search" placeholder="搜索买家需求…"><button class="circle">⌁</button><button class="circle">◌</button></nav><div class="intro"><small>WHAT WE DO</small><h1>让全球买家需求，<br>直接连接贵州供应商。</h1></div><div class="hero-copy"><p>买家猎手从公开 RFQ、企业新品和交易变化中识别采购窗口，完成规格与准入判断，把“谁值得联系”变成一笔可执行的商机。</p><button class="cta" onclick="document.querySelector('#opps').scrollIntoView({behavior:'smooth'})">探索今日机会　→</button></div><aside class="float"><small>今日采购窗口</small><b>5 条</b><em>3 条高意向需求待跟进</em></aside></section><section class="section"><div class="section-head"><div><h2>高意向采购机会</h2><p>每条需求都有来源、匹配解释和建议动作。</p></div><div class="filters"><button class="active" data-f="all">全部</button><button data-f="matcha">贵州抹茶</button><button data-f="blueberry">蓝莓</button><button data-f="open">窗口打开</button></div></div><div class="cards" id="opps"></div><div class="details" id="details"></div><div class="banner-slot"><div class="banner-copy">从“找得到买家”，到“判断今天是否值得追”。</div></div><div class="pillars"><div class="pillar"><i>⌕</i>可追溯的原始采购证据</div><div class="pillar"><i>◈</i>规格、认证与产能匹配</div><div class="pillar"><i>↗</i>报价、寄样或补证行动</div></div></section></div></main><div class="toast" id="toast">已生成中 / 英 / 日首封跟进邮件</div>
<script>
const DATA=[{id:1,c:'matcha',score:94,status:'窗口打开',country:'美国',buyer:'饮料品牌',title:'采购有机抹茶粉，用于新品饮料',qty:'500 kg / 月',tags:['Organic','OEM','800目+'],why:'7天前发布新 RFQ，官网同步上线抹茶新品。',fit:'5 / 6 项满足',access:'补条件',action:'先发样品与认证清单',risk:'USDA Organic 文件待确认；FDA 食品进口要求已覆盖。'},{id:2,c:'matcha',score:87,status:'可进入',country:'日本',buyer:'食品企业',title:'寻找稳定的第二抹茶供应源',qty:'1 t / 季',tags:['食品级','JAS','长期合作'],why:'采购频率提升，并出现第二供应商信号。',fit:'6 / 6 项满足',access:'PASS',action:'切入第二供应源',risk:'预算未披露，建议首轮确认目标价格带。'},{id:3,c:'matcha',score:81,status:'风险',country:'欧盟',buyer:'零售品牌',title:'定制品牌抹茶粉与零售包装',qty:'2,000 units',tags:['Private label','农残','定制包装'],why:'定制需求明确，但农残标准和有机文件待核验。',fit:'4 / 6 项满足',access:'待复核',action:'先做准入核验',risk:'欧盟农残限量、标签声称与有机文件待确认。'},{id:4,c:'blueberry',score:79,status:'窗口打开',country:'韩国',buyer:'烘焙集团',title:'冷冻蓝莓原料年度采购',qty:'20 t / 年',tags:['IQF','冷链','框架采购'],why:'年度采购即将截止，买家正比较第二供应源。',fit:'5 / 6 项满足',access:'PASS',action:'立即报价并寄样',risk:'冷链交付时效需确认。'}];let selected=1,filter='all';const cards=document.querySelector('#opps'),details=document.querySelector('#details');function tone(o){return o.status==='风险'?'risk':o.status==='可进入'?'':'warn'}function draw(){document.querySelectorAll('[data-f]').forEach(b=>b.classList.toggle('active',b.dataset.f===filter));cards.innerHTML=DATA.filter(o=>filter==='all'||o.c===filter||(filter==='open'&&o.status==='窗口打开')).map(o=>`<article class="card ${o.id===selected?'selected':''}" onclick="showDetail(${o.id})"><div class="card-image"><span class="status ${tone(o)}">${o.status}</span><span class="card-score">${o.score}</span></div><div class="card-body"><div class="dots"><i></i><i></i><i></i></div><h3>${o.country} · ${o.buyer}<br>${o.title}</h3><p>${o.why}</p><div class="chips">${o.tags.map(t=>`<span style="font-size:10px;background:#f2f4f0;padding:3px 5px;border-radius:4px;margin-right:4px">${t}</span>`).join('')}</div><div class="card-foot"><b>${o.qty}</b><button>查看　→</button></div></div></article>`).join('')}function showDetail(id){selected=id;draw();const o=DATA.find(x=>x.id===id);details.className='details show';details.innerHTML=`<div><small style="color:var(--green);font-weight:800;letter-spacing:1px">${o.country} · 采购机会详情</small><h2>${o.title}</h2><p>${o.why} 建议下一步：${o.action}。</p><div class="facts"><div><small>原始 RFQ</small><b>需求已采集</b></div><div><small>买家变化</small><b>近期出现新信号</b></div><div><small>供需匹配</small><b>${o.fit}</b></div></div></div><aside class="decision"><small>机会分</small><b>${o.score}</b><p style="font-size:12px">市场准入：${o.access}</p><div class="risk-box">${o.risk}</div><button onclick="mail()">生成首封跟进邮件　→</button></aside>`;details.scrollIntoView({behavior:'smooth',block:'nearest'})}function mail(){const t=document.querySelector('#toast');t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2300)}document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{filter=b.dataset.f;draw()});draw();
</script></body></html>
