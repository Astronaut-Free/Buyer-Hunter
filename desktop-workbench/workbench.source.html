function initStack(){const scroller=$('#opportunityStack');if(!scroller)return;const cards=$$('.stack-card',scroller),inner=$('.stack-inner',scroller);let frame=0;function update(){const gap=23,step=cards[0]?.offsetHeight+gap||330,top=3,dist=12;inner.style.height=`${(cards.length-1)*step+scroller.clientHeight}px`;cards.forEach((c,i)=>{c.style.position='absolute';c.style.left='4px';c.style.width='calc(100% - 8px)';c.style.top=top+i*step+'px';c.style.zIndex=i+1;const trigger=i*step-i*dist;const translate=Math.max(0,scroller.scrollTop-trigger);const progress=Math.max(0,Math.min(1,(scroller.scrollTop-trigger)/(step*.8)));const targetScale=.90+i*.032;c.style.transform=`translate3d(0,${translate}px,0) scale(${1-progress*(1-Math.min(1,targetScale))})`;});const idx=Math.min(cards.length-1,Math.round(scroller.scrollTop/step));view.stackIndex=idx;$$('.stack-dots button').forEach((b,i)=>{b.classList.toggle('active',i===idx);b.setAttribute('aria-current',i===idx?'true':'false')})}const schedule=()=>{cancelAnimationFrame(frame);frame=requestAnimationFrame(update)};scroller.addEventListener('scroll',schedule,{passive:true});const ro=new ResizeObserver(schedule);ro.observe(scroller);update();cleanup=()=>{cancelAnimationFrame(frame);scroller.removeEventListener('scroll',schedule);ro.disconnect()}}

function scrollThread(){const el=$('#threadScroll');if(el)el.scrollTop=view.threadTab==='chat'?el.scrollHeight:0}
function agentMessage(text,self=false){return `<article class="message ${self?'self':''}">${avatar(self?'user':'agent')}<div class="message-content"><div class="message-name">${self?'我':'黔脉 Agent'}</div><div class="bubble">${escapeHTML(text)}</div></div></article>`}
const products={matcha:{name:'有机抹茶原料',spec:'800 目 · 食品级',cert:'EU / USDA Organic',moq:'300 kg',capacity:'20 吨 / 月'},green:{name:'高山绿茶',spec:'贵州春茶 · 散装',cert:'ISO 22000',moq:'200 kg',capacity:'15 吨 / 月'}};
const modes={research:{name:'只寻找和研究',desc:'交付买家清单和研究报告，不进行对外联系。'},prepare:{name:'准备联系内容',desc:'增加买家联系方式与联系草稿，由你决定发送。'},auto:{name:'低风险自动联系',desc:'增加跟进状态，沟通记录同步到消息中心。'}};
function missionStep(){const m=S.mission,p=products[m.product];if(m.status==='running'||m.result)return '';if(m.step===1)return `<div class="step-card"><div class="step-label">01 / 选择产品</div><h3>这次，想为哪款产品找买家？</h3>${Object.entries(products).map(([id,p])=>`<button class="product-choice ${m.product===id?'active':''}" data-action="missionProduct" data-product="${id}"><i class="radio-dot"></i><div><strong>${p.name}</strong><p>${p.spec} · ${p.cert}</p></div></button>`).join('')}<div class="product-context"><span>最小起订 <b>${p.moq}</b></span><span>月产能 <b>${p.capacity}</b></span></div><button class="btn primary wide" data-action="missionNext">确认产品，继续 ${icon('arrow')}</button></div>`;if(m.step===2)return `<div class="step-card"><div class="step-label">02 / 定义目标</div><h3>你想找到什么样的买家？</h3><textarea id="missionTarget" class="input" rows="3" placeholder="例如：帮我找美国和加拿大正在采购抹茶原料的食品品牌。">${escapeHTML(m.prompt)}</textarea><div class="fine" style="font-size:14px;margin:12px 0 7px">也可以从一个方向开始</div>${['美国和加拿大的食品品牌','德国正在补货的营养食品企业'].map(t=>`<button class="suggestion" data-action="missionSuggestion" data-text="帮我找${t}，优先近期有采购变化的公司。">${t} ${icon('arrow')}</button>`).join('')}<button class="btn primary wide" style="margin-top:12px" data-action="missionParse">确认目标 ${icon('arrow')}</button></div>`;return `<div class="step-card"><div class="step-label">03 / 选择交付</div><h3>这次，希望 AI 做到哪一步？</h3>${Object.entries(modes).map(([k,v])=>`<label class="mode-choice ${m.mode===k?'selected':''}"><input type="radio" name="missionMode" value="${k}" ${m.mode===k?'checked':''}><div><strong>${v.name}</strong><span>${v.desc}</span></div></label>`).join('')}<div class="rule" style="margin:14px 0"></div><label class="switch-row" style="font-size:14px"><span>所有首次联系都需要我确认</span><input class="switch" type="checkbox" id="missionApproval" ${m.approval?'checked':''} aria-label="所有首次联系需要确认"></label><p class="fine" style="font-size:14px;margin:9px 0 14px">正式报价与商务承诺始终保留人工确认。</p><button class="btn primary wide" data-action="missionRun">${icon('spark')} 开始寻找商机</button></div>`}
function missionIntent(){const p=S.mission.prompt;let markets=['美国','加拿大','德国','法国','英国','日本','韩国','澳大利亚','新加坡','阿联酋','越南','马来西亚'].filter(c=>p.includes(c));if(!markets.length&&/北美/.test(p))markets=['美国','加拿大'];if(!markets.length&&/欧洲/.test(p))markets=['德国','法国','英国'];const roles=[];if(/品牌|brand/i.test(p))roles.push('品牌商');if(/进口商|分销|批发|importer|distributor/i.test(p))roles.push('进口与分销');if(/零售|门店|retail/i.test(p))roles.push('零售商');const industry=/食品|饮料|饮品|营养|food/i.test(p)?'食品与饮料':'茶叶与植物原料';const signals=[];if(/进口增长|进口量|增长/.test(p))signals.push('进口增长');if(/换供应商|供应商变化|供应商切换/.test(p))signals.push('供应商变化');if(/新品|新产品/.test(p))signals.push('新品计划');if(/补货|采购需求|正在采购/.test(p))signals.push('采购需求');return {markets,roles,industry,signals}}
function missionMatches(){const intent=missionIntent();let list=sample.map(o=>opp(o.id)).filter(o=>o.category===S.mission.product&&!['已完成','已归档'].includes(o.stage));if(intent.markets.length)list=list.filter(o=>intent.markets.includes(o.country));if(intent.roles.length)list=list.filter(o=>intent.roles.some(r=>r==='品牌商'?/品牌|营养/.test(o.role):r==='进口与分销'?/进口|分销/.test(o.role):/零售/.test(o.role)));if(intent.signals.length)list.sort((a,b)=>intent.signals.filter(s=>b.signal.includes(s.slice(0,2))).length-intent.signals.filter(s=>a.signal.includes(s.slice(0,2))).length);return list.slice(0,5)}
function deliveryTable(){const m=S.mission,results=missionMatches();return `<div class="table-wrap"><table aria-label="找新商机交付表格"><thead><tr><th>买家</th><th>产品</th><th>发往地</th><th>截止时间</th><th>金额 · USD</th>${m.mode!=='research'?'<th>联系方式</th>':''}${m.mode==='auto'?'<th>跟进状态</th>':''}</tr></thead><tbody>${results.map(o=>`<tr><td><button class="text-btn" data-action="detail" data-id="${o.id}" style="text-align:left"><strong>${o.company}</strong></button><small>${o.flag} ${o.country}</small></td><td>${o.product}</td><td>${o.destination.split(' · ')[1]}</td><td><small>2026.${o.due}</small></td><td class="num">${money(o.amount)}</td>${m.mode!=='research'?`<td><strong>${o.contact.split(' ')[0]}</strong><button class="text-btn" data-action="contactDraft" data-id="${o.id}">${icon('mail')} 联系资料</button></td>`:''}${m.mode==='auto'?`<td><button class="text-btn" data-action="missionLogs" data-id="${o.id}">${S.takeovers.includes(o.id)?'人工接管':o.riskLevel==='high'?'待补资料':m.approval?'待确认首联':'已记录联系'} ${icon('arrow')}</button></td>`:''}</tr>`).join('')}</tbody></table>${results.length?'':`<div class="empty"><h3>样例库中暂无匹配买家</h3><p>调整目标市场后可重新体验。</p></div>`}</div>`}

 return deliveryTable()+`<div class="mission-end">${icon('circleCheck')} ${m.mode==='research'?'买家清单与研究报告已就绪。':m.mode==='prepare'?'点击「联系资料」查看联系人和草稿。':'点击「跟进状态」查看消息和工作日志。'}</div>`;

 sendMessage:()=>{const el=$('#messageComposer'),v=el?.value.trim();if(!v&&!S.attachments[view.conversation])return toast('请先输入回复内容');addMessage(view.conversation,v||'请查收产品资料。',S.attachments[view.conversation]||'');S.attachments[view.conversation]='';S.replyDrafts[view.conversation]='';if(view.conversation==='northleaf')S.handled.push('reply');persist();render();toast('回复已保存在本地演示会话')},
 attach:()=>openDialog(dialogTitle('选择企业资料')+`<p>将资料附在当前回复中。</p>${['有机抹茶产品规格表.pdf','有机认证资料.pdf','企业与产能介绍.pdf'].map(t=>`<button class="source-row" data-action="chooseAttachment" data-name="${t}"><span class="row">${icon('file')}${t}</span>${icon('plus')}</button>`).join('')}<p class="note">附件为资料名称示例，不包含真实文件。</p>`),chooseAttachment:b=>{S.attachments[view.conversation]=b.dataset.name;persist();closeDialog();$('#attachmentPreview').innerHTML=`<span class="attachment-tag">${icon('paperclip')}${escapeHTML(S.attachments[view.conversation])}<button data-action="removeAttachment" aria-label="移除附件">×</button></span>`},removeAttachment:()=>{S.attachments[view.conversation]='';persist();$('#attachmentPreview').innerHTML=''},conversationDrawer:()=>openDialog(dialogTitle('沟通列表')+conversationIds().map(conversationItem).join(''),true),
 missionProduct:b=>{S.mission.product=b.dataset.product;persist();render()},missionNext:()=>{S.mission.step=2;S.mission.history.push({self:true,text:`我要为${products[S.mission.product].name}寻找买家。`},{self:false,text:'产品资料已带入。告诉我，你想找哪里的哪类买家？'});persist();render()},missionSuggestion:b=>{$('#missionTarget').value=b.dataset.text;S.mission.prompt=b.dataset.text},missionParse:()=>parseMission($('#missionTarget')?.value||S.mission.prompt),missionRun:runMission,
 agentSend:()=>{const v=$('#agentComposer').value.trim();if(!v)return toast('先写下你的找商机目标');if(S.mission.step===1){S.mission.product=/绿茶/.test(v)?'green':'matcha';S.mission.history.push({self:true,text:v},{self:false,text:`我会带入${products[S.mission.product].name}的企业产品资料。请确认想要的交付深度。`});S.mission.prompt=v;S.mission.step=3;persist();render()}else parseMission(v)},
 adjustDelivery:()=>{S.mission.step=3;S.mission.result=false;S.mission.status='idle';persist();render()},deliveryTab:b=>{S.mission.tab=b.dataset.tab;persist();render()},export:exportFile,missionLogs:b=>{view.threadTab='logs';go('messages',b.dataset.id)},contactDraft:b=>{const o=opp(b.dataset.id);openDialog(dialogTitle('联系资料与草稿')+`<p><strong>${o.contact}</strong> · ${o.position}<br>${o.email}</p><textarea class="draft" rows="8" readonly aria-label="联系草稿">${escapeHTML(defaultDraft(o))}</textarea><div class="dialog-footer"><button class="btn primary" data-action="openContact" data-id="${o.id}">前往商机处理 ${icon('arrow')}</button></div>`)},openContact:b=>{closeDialog();go('detail',b.dataset.id)},
 newMission:()=>{if(!S.mission.history.length)return;openDialog(dialogTitle('开始新的找商机任务')+'<p>新的任务将替换当前交付清单。已记录的商机消息和工作日志会继续保留。</p><div class="dialog-footer"><button class="btn" data-action="close">取消</button><button class="btn primary" data-action="confirmNewMission">开始新任务</button></div>')},confirmNewMission:()=>{clearInterval(missionTimer);S.mission={...structuredClone(initialState.mission),approval:S.settings.firstApproval};persist();closeDialog();render()},
 resetDemo:()=>openDialog(dialogTitle('重置本地演示？')+'<p>本次演示的收藏、消息、暂缓安排和任务结果会恢复初始值。此操作仅影响当前浏览器中的黔脉演示数据。</p><div class="dialog-footer"><button class="btn" data-action="close">保留数据</button><button class="btn primary" data-action="confirmReset">重置演示</button></div>'),confirmReset:()=>{clearInterval(missionTimer);S=structuredClone(initialState);view.marketTab='new';view.countries=[];view.stageFilter='';view.threadTab='chat';view.messageFilter='all';persist();closeDialog();go('today');toast('已恢复初始演示数据')}
};
document.addEventListener('click',e=>{if(e.target.matches('[data-overlay]')){closeDialog();return}const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const action=actions[b.dataset.action];if(action){e.preventDefault();action(b)}});
document.addEventListener('input',e=>{const t=e.target;if(t.id==='marketQuery'){view.marketQuery=t.value;updateMarket()}if(t.id==='messageSearch'){view.messageQuery=t.value;$('#conversationItems').innerHTML=filteredConversations().map(conversationItem).join('')||'<div class="empty">暂无匹配会话</div>'}if(t.id==='commandSearch')$('#commandResults').innerHTML=searchResults(t.value);if(t.id==='actionDraft'){S.drafts[view.id]=t.value;persist()}if(t.id==='messageComposer'){S.replyDrafts[view.conversation]=t.value;persist()}if(t.id==='missionTarget')S.mission.prompt=t.value});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='topProduct'){S.product=t.value;persist();render();toast('已切换当前产品')}if(t.name==='country'){view.countries=$$('input[name="country"]:checked').map(e=>e.value);updateMarket()}if(t.id==='riskFilter'){view.risk=t.value;updateMarket()}if(t.id==='marketSort'){view.sort=t.value;updateMarket()}if(t.name==='missionMode'){S.mission.mode=t.value;persist();render()}if(t.id==='missionApproval'){S.mission.approval=t.checked;persist()}if(t.id==='notificationSwitch'){S.settings.notifications=t.checked;persist();toast('提醒偏好已保存')}if(t.id==='approvalSwitch'){S.settings.firstApproval=t.checked;persist();toast('新任务默认权限已保存')}});
document.addEventListener('submit',e=>{if(e.target.id==='settingsForm'){e.preventDefault();S.settings.enterprise=$('#settingEnterprise').value.trim()||'黔山茶业';S.settings.email=$('#settingEmail').value.trim();persist();renderNav();toast('企业资料已保存')}});
document.addEventListener('keydown',e=>{if(e.isComposing)return;if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();searchDialog();return}if(e.key==='Escape')closeDialog();if(e.key==='Enter'&&!e.shiftKey&&['messageComposer','agentComposer'].includes(e.target.id)){e.preventDefault();actions[e.target.id==='messageComposer'?'sendMessage':'agentSend']();return}const dialog=$('[role="dialog"]');if(dialog&&e.key==='Tab'){const focusable=$$('button:not([disabled]),a[href],input:not([disabled]),textarea:not([disabled]),select:not([disabled])',dialog).filter(el=>el.offsetParent!==null);const first=focusable[0],last=focusable.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus()}}if($('#commandSearch')){const r=$$('.command-result'),index=r.indexOf(document.activeElement);if(e.key==='ArrowDown'){e.preventDefault();r[Math.min(r.length-1,index+1)]?.focus()}if(e.key==='ArrowUp'){e.preventDefault();if(index<=0)$('#commandSearch').focus();else r[index-1]?.focus()}if(e.key==='Enter'&&document.activeElement.id==='commandSearch'){e.preventDefault();r[0]?.click()}}});

// Native interaction effects inspired by React Bits Animated List, Spotlight Card,
// and Star Border. Independently implemented; no React runtime or component source.
// References: https://reactbits.dev/components/animated-list
// https://reactbits.dev/components/spotlight-card
// https://reactbits.dev/animations/star-border
const reducedMotion=matchMedia('(prefers-reduced-motion: reduce)');
const finePointer=matchMedia('(hover: hover) and (pointer: fine)');
let spotlightFrame=0,spotlightTarget=null,spotlightX=0,spotlightY=0;
document.addEventListener('pointermove',e=>{
 if(reducedMotion.matches||!finePointer.matches||e.pointerType==='touch')return;
 const card=e.target.closest('[data-spotlight]');
 if(!card)return;
 spotlightTarget=card;spotlightX=e.clientX;spotlightY=e.clientY;
 if(spotlightFrame)return;
 spotlightFrame=requestAnimationFrame(()=>{
  spotlightFrame=0;
  if(!spotlightTarget?.isConnected)return;
  const r=spotlightTarget.getBoundingClientRect();
  spotlightTarget.style.setProperty('--spot-x',(spotlightX-r.left)+'px');
  spotlightTarget.style.setProperty('--spot-y',(spotlightY-r.top)+'px');
 });
},{passive:true});
